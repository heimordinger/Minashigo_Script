<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click测试</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            border: 5px solid #000;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.5;
        }

        #button-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        button {
            position: absolute;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: all; /* 确保按钮的点击区域完整 */
        }

        button:hover {
            background-color: #0056b3;
        }

        .red-dot {
            position: absolute;
            width: 10px;  /* 调整为10px */
            height: 10px;  /* 调整为10px */
            background-color: red;
            border-radius: 50%;  /* 圆形 */
        }
    </style>
</head>
<body>
    <div id="info">
        <div id="click-coords">点击坐标：X: -, Y: -</div>
        <div id="current-button">当前按钮坐标：X: -, Y: -</div>
        <div id="previous-button">上一个按钮坐标：X: -, Y: -</div>
        <div id="current-button2">第二个按钮坐标：X: -, Y: -</div>
        <div id="previous-button2">第二个按钮上一个坐标：X: -, Y: -</div>
        <div id="body-size">Body尺寸：宽: -, 高: -</div>
    </div>
    <div id="button-container">
        <button id="random-button" style="left: 200px; top: 200px;">点击我</button>
        <button id="random-button2" style="left: 300px; top: 300px;">点击我</button>
    </div>

    <script>
        // 获取 DOM 元素
        const clickCoords = document.getElementById('click-coords');
        const currentButtonCoords = document.getElementById('current-button');
        const previousButtonCoords = document.getElementById('previous-button');
        const currentButton2Coords = document.getElementById('current-button2');
        const previousButton2Coords = document.getElementById('previous-button2');
        const bodySizeDisplay = document.getElementById('body-size');
        const buttonContainer = document.getElementById('button-container');
        const button1 = document.getElementById('random-button');
        const button2 = document.getElementById('random-button2');

        // 记录按钮的上一个坐标
        let previousButton1X = '-';
        let previousButton1Y = '-';
        let previousButton2X = '-';
        let previousButton2Y = '-';

        // 预定义的五个固定位置
        const fixedPositions = [
            { x: 100, y: 100 },
            { x: 200, y: 200 },
            { x: 300, y: 300 },
            { x: 400, y: 400 },
            { x: 500, y: 500 }
        ];

        // 随机选择一个固定位置，避免与已有按钮重叠
        const getRandomPosition = () => {
            let randomPosition;
            let overlap = true;
            while (overlap) {
                randomPosition = fixedPositions[Math.floor(Math.random() * fixedPositions.length)];
                overlap = (Math.abs(randomPosition.x - parseInt(button1.style.left, 10)) < 100 &&
                           Math.abs(randomPosition.y - parseInt(button1.style.top, 10)) < 100) ||
                          (Math.abs(randomPosition.x - parseInt(button2.style.left, 10)) < 100 &&
                           Math.abs(randomPosition.y - parseInt(button2.style.top, 10)) < 100);
            }
            return randomPosition;
        }

        // 初始化当前按钮的坐标
        const updateCurrentButtonCoords = (button, buttonCoordsElement) => {
            // 获取按钮的左上角坐标
            const buttonX = parseInt(button.style.left, 10);
            const buttonY = parseInt(button.style.top, 10);

            // 获取按钮的宽度和高度
            const buttonWidth = button.offsetWidth;
            const buttonHeight = button.offsetHeight;

            // 计算按钮的中心坐标
            const centerX = buttonX + buttonWidth / 2;
            const centerY = buttonY + buttonHeight / 2;

            // 更新显示的按钮中心坐标
            buttonCoordsElement.textContent = `坐标：X: ${centerX}, Y: ${centerY}`;
        };

        // 按钮1点击事件
        button1.addEventListener('click', () => {
            // 更新上一个按钮1的坐标
            previousButton1X = parseInt(button1.style.left, 10);
            previousButton1Y = parseInt(button1.style.top, 10);
            previousButtonCoords.textContent = `上一个按钮坐标：X: ${previousButton1X}, Y: ${previousButton1Y}`;

            // 隐藏当前按钮
            button1.style.display = 'none';

            // 随机选择一个位置
            const randomPosition1 = getRandomPosition();
            button1.style.left = `${randomPosition1.x}px`;
            button1.style.top = `${randomPosition1.y}px`;

            // 显示按钮并更新坐标
            button1.style.display = 'block';
            updateCurrentButtonCoords(button1, currentButtonCoords);
        });

        // 按钮2点击事件
        button2.addEventListener('click', () => {
            // 更新上一个按钮2的坐标
            previousButton2X = parseInt(button2.style.left, 10);
            previousButton2Y = parseInt(button2.style.top, 10);
            previousButton2Coords.textContent = `上一个按钮坐标：X: ${previousButton2X}, Y: ${previousButton2Y}`;

            // 隐藏当前按钮
            button2.style.display = 'none';

            // 随机选择一个位置
            const randomPosition2 = getRandomPosition();
            button2.style.left = `${randomPosition2.x}px`;
            button2.style.top = `${randomPosition2.y}px`;

            // 显示按钮并更新坐标
            button2.style.display = 'block';
            updateCurrentButtonCoords(button2, currentButton2Coords);
        });

        // 监听鼠标点击事件，更新点击坐标
        document.addEventListener('click', (event) => {
            // 获取点击坐标
            const x = event.clientX;
            const y = event.clientY;
            clickCoords.textContent = `点击坐标：X: ${x}, Y: ${y}`;
        });

        // 更新 Body 尺寸信息
        const updateBodySize = () => {
            const bodyWidth = document.body.clientWidth;  // Body 宽度
            const bodyHeight = document.body.clientHeight;  // Body 高度
            bodySizeDisplay.textContent = `Body尺寸：宽: ${bodyWidth}, 高: ${bodyHeight}`;
        };

        // 初始化 Body 尺寸
        updateBodySize();

        // 监听窗口大小变化事件
        window.addEventListener('resize', updateBodySize);
    </script>
</body>
</html></title>
</head>

</html>
