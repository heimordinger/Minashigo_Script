// core/account-manager.js

class AccountManager {
  constructor() {
    this.currentAccount = null;
    this.accounts = new Map();
  }

  /**
   * 设置当前账号
   * @param {Object} account - 账号信息 {name: string, email: string}
   */
  setCurrentAccount(account) {
    this.currentAccount = account;
    if (account) {
      this.accounts.set(account.email, account);
    }
    
    // 通知其他组件账号已变更
    window.dispatchEvent(new CustomEvent('accountChanged', {
      detail: { account: this.currentAccount }
    }));
  }

  /**
   * 获取当前账号
   * @returns {Object|null} 当前账号信息
   */
  getCurrentAccount() {
    return this.currentAccount;
  }

  /**
   * 获取账号名称
   * @returns {string} 账号名称
   */
  getAccountName() {
    return this.currentAccount?.name || 'unknown';
  }

  /**
   * 获取账号邮箱
   * @returns {string} 账号邮箱
   */
  getAccountEmail() {
    return this.currentAccount?.email || '';
  }

  /**
   * 检查是否有当前账号
   * @returns {boolean} 是否有当前账号
   */
  hasAccount() {
    return this.currentAccount !== null;
  }

  /**
   * 添加账号到缓存
   * @param {Object} account - 账号信息
   */
  addAccount(account) {
    this.accounts.set(account.email, account);
  }

  /**
   * 根据邮箱获取账号
   * @param {string} email - 账号邮箱
   * @returns {Object|null} 账号信息
   */
  getAccount(email) {
    return this.accounts.get(email) || null;
  }

  /**
   * 获取所有账号
   * @returns {Array} 账号列表
   */
  getAllAccounts() {
    return Array.from(this.accounts.values());
  }

  /**
   * 清除当前账号
   */
  clearCurrentAccount() {
    this.currentAccount = null;
    window.dispatchEvent(new CustomEvent('accountChanged', {
      detail: { account: null }
    }));
  }

  /**
   * 将账号信息添加到请求参数
   * @param {Object} params - 请求参数
   * @returns {Object} 包含账号信息的参数
   */
  addAccountToParams(params = {}) {
    if (this.currentAccount) {
      return {
        ...params,
        account: this.currentAccount
      };
    }
    return params;
  }

  /**
   * 获取账号标识符（用于日志、调试等）
   * @returns {string} 账号标识符
   */
  getAccountIdentifier() {
    if (!this.currentAccount) return 'no-account';
    return `${this.currentAccount.name}(${this.currentAccount.email})`;
  }
}

// ── JS&PyMessage/message.js ──
class Message {

    static createEmptyTask() {
        return {
            type: "task",

            meta: {
                id: crypto.randomUUID(),
                timestamp: Date.now(),
                account: null,
            },

            task: {
                task_name: null,
                properties: {},
                timeout: null,
            },

            // 每个表单独立的验证标记
            validated: false
        };
    }

    static validate(form) {

        if (!form.meta.account) {
            throw new Error("传递对象为空");
        }

        if (!form.task.task_name) {
            throw new Error("操作名称为空");
        }

        if (
            !form.task.properties ||
            typeof form.task.properties !== "object"
        ) {
            throw new Error("未传递操作参数");
        }

        // 验证通过
        form.validated = true;
    }
}

// ── JS&PyMessage/wsManager.js ──
// wsManager.js
class WSManager {
    static instance = null;

    constructor(url) {
        if (WSManager.instance) {
            return WSManager.instance;
        }

        this.url = url || null;
        this.ws = null;
        this.callbacks = {};
        WSManager.instance = this;
        return this;
    }

    connect(url) {
        // 优先用传入 URL，其次用构造时保存的
        const targetUrl = url || this.url;
        if (!targetUrl) {
            throw new Error("WebSocket URL 未提供");
        }

        this.url = targetUrl;

        // 已连接或正在连接中，不重复创建
        if (this.ws) {
            if (this.ws.readyState === WebSocket.OPEN || this.ws.readyState === WebSocket.CONNECTING) return;
        }

        this.ws = new WebSocket(targetUrl);

        this.ws.onopen = () => {
            console.log("[WS] Connected to", targetUrl);
            // 重连计数器重置
            this.reconnectAttempts = 0;
        };
        
        this.ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);

                // 全局ping消息 - 后端在长时间操作中发来的保活信号
                if (msg.type === "ping") {
                    window.workflowController?.onPingResponse?.();
                    console.debug("[WS] 收到ping保活信号");
                    return;
                }

                if (msg.meta?.id && this.callbacks[msg.meta.id]) {
                    this.callbacks[msg.meta.id](msg);
                    delete this.callbacks[msg.meta.id];
                }
            } catch (e) {
                console.error("[WS] Message parsing error:", e, event.data);
            }
        };
        
        this.ws.onclose = (event) => {
            console.log("[WS] Disconnected, code:", event.code, "reason:", event.reason);
            
            // 只有在非正常关闭时才重连
            if (event.code !== 1000 && event.code !== 1001) {
                // 自动重连，但增加延迟避免循环
                this.attemptReconnect();
            } else {
                console.log("[WS] 正常关闭，不重连");
            }
        };
        
        this.ws.onerror = (err) => {
            console.error("[WS] Error:", err);
            // 连接错误时也尝试重连，但增加延迟
            if (!this.isReconnecting) {
                setTimeout(() => this.attemptReconnect(), 3000);
            }
        };
    }

    sendTask(form) {
        return new Promise((resolve, reject) => {
            if (!form.validated) return reject(new Error("表单未验证"));
            if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                return reject(new Error("WebSocket 未连接"));
            }

            this.callbacks[form.meta.id] = resolve;
            this.ws.send(JSON.stringify(form));

            setTimeout(() => {
                if (this.callbacks[form.meta.id]) {
                    delete this.callbacks[form.meta.id];
                    reject(new Error("等待响应超时"));
                }
            }, form.task.timeout ?? 30*1000);
        });
    }
    
    attemptReconnect() {
        if (this.reconnectAttempts >= 5) {
            console.error("[WS] 重连次数已达上限，停止重连");
            return;
        }
        
        // 防止重复重连
        if (this.isReconnecting) {
            console.log("[WS] 已在重连中，跳过重复重连");
            return;
        }
        
        this.isReconnecting = true;
        this.reconnectAttempts = (this.reconnectAttempts || 0) + 1;
        console.log(`[WS] 尝试重连 (${this.reconnectAttempts}/5)...`);
        
        setTimeout(() => {
            this.isReconnecting = false;
            this.connect();
        }, 5000 * this.reconnectAttempts); // 增加延迟，避免快速循环
    }
}

// ── core/node-reporter.js ──
function reportNodeEvent(node, event, payload = {}) {
  const backend = window.taskflow?.backend;
  if (!backend) return;

  // Fire-and-forget: 不 await，避免日志上报阻塞任务执行
  backend.invoke("node_event", {
    node_id: node?.id ?? null,
    node_type: node?.type ?? null,
    node_title: node?.title ?? node?.constructor?.title ?? "unknown",
    event,
    payload,
  }).catch(() => {});
}

function openTextInputDialog({ title, value = "" }) {
  const el = ensureDialog();
  const titleEl = el.querySelector("#tf-text-input-title");
  const inputEl = el.querySelector("#tf-text-input-field");
  const okBtn = el.querySelector("#tf-text-input-ok");
  const cancelBtn = el.querySelector("#tf-text-input-cancel");

  return new Promise(resolve => {
    const close = result => {
      el.style.display = "none";
      okBtn.onclick = null;
      cancelBtn.onclick = null;
      el.onclick = null;
      inputEl.onkeydown = null;
      resolve(result);
    };

    titleEl.textContent = title || "输入";
    inputEl.value = value ?? "";
    el.style.display = "flex";

    setTimeout(() => {
      inputEl.focus();
      inputEl.select();
    }, 0);

    okBtn.onclick = () => close(inputEl.value);
    cancelBtn.onclick = () => close(null);
    el.onclick = evt => {
      if (evt.target === el) close(null);
    };
    inputEl.onkeydown = evt => {
      if (evt.key === "Enter") close(inputEl.value);
      if (evt.key === "Escape") close(null);
    };
  });
}

async function editTextWidgetProperty(node, propertyKey, { title, widget } = {}) {
  const value = await openTextInputDialog({
    title,
    value: node.properties?.[propertyKey],
  });
  if (value == null) return null;

  node.properties = node.properties || {};
  node.properties[propertyKey] = String(value).trim();
  if (widget) widget.value = node.properties[propertyKey];
  node.setDirtyCanvas?.(true, true);
  return node.properties[propertyKey];
}

// 创建属性输入控件
function createPropertyInput(propName, propValue, propConfig = {}) {
  const container = document.createElement("div");
  container.style.cssText = "display:flex;flex-direction:column;gap:4px;";

  const label = document.createElement("label");
  label.textContent = propConfig.label || propName;
  label.style.cssText = "font-size:12px;color:#aaa;";
  container.appendChild(label);

  let input;
  const type = propConfig.type || typeof propValue;

  switch (type) {
    case "number":
      input = document.createElement("input");
      input.type = "number";
      input.value = propValue ?? 0;
      if (propConfig.min !== undefined) input.min = propConfig.min;
      if (propConfig.max !== undefined) input.max = propConfig.max;
      if (propConfig.step) input.step = propConfig.step;
      break;

    case "select":
      input = document.createElement("select");
      const options = propConfig.options || propConfig.values || [];
      options.forEach(opt => {
        const option = document.createElement("option");
        option.value = opt.value || opt;
        option.textContent = opt.label || opt;
        if (String(opt.value || opt) === String(propValue)) {
          option.selected = true;
        }
        input.appendChild(option);
      });
      break;

    case "boolean":
      input = document.createElement("input");
      input.type = "checkbox";
      input.checked = Boolean(propValue);
      break;

    default:
      input = document.createElement("input");
      input.type = "text";
      input.value = propValue ?? "";
  }

  input.style.cssText = [
    "width:100%",
    "height:32px",
    "border:1px solid #555",
    "border-radius:4px",
    "background:#111",
    "color:#fff",
    "padding:0 8px",
    "outline:none",
  ].join(";");

  if (type === "boolean") {
    input.style.width = "auto";
    input.style.height = "20px";
  }

  container.appendChild(input);

  return { container, input, type };
}

// 打开节点属性编辑器
function openNodePropertyEditor(node) {
  const el = ensurePropertyDialog();
  const titleEl = el.querySelector("#tf-property-title");
  const listEl = el.querySelector("#tf-property-list");
  const okBtn = el.querySelector("#tf-property-ok");
  const cancelBtn = el.querySelector("#tf-property-cancel");

  // 清空现有属性列表
  listEl.innerHTML = "";

  // 设置标题
  titleEl.textContent = `${node.title || "节点"} 属性`;

  // 获取属性配置
  const propertiesInfo = node.properties_info || [];
  const properties = node.properties || {};

  // 存储输入控件引用
  const propertyInputs = new Map();

  // 创建属性名到widget的映射
  const propToWidgetMap = new Map();
  if (node.widgets) {
    // 优先使用 properties_info 中的 label 与 widget.name 进行匹配
    if (node.properties_info) {
      node.properties_info.forEach(propConfig => {
        const propName = propConfig.name;
        const label = propConfig.label || propName;
        node.widgets.forEach(widget => {
          // 尝试通过 widget.name 匹配 label
          if (widget.name === label) {
            propToWidgetMap.set(propName, widget);
          }
          // 尝试通过 widget.label 匹配 label
          if (widget.label === label) {
            propToWidgetMap.set(propName, widget);
          }
        });
      });
    }

    // 如果没有匹配到，尝试通过 widget.name 直接匹配属性名
    if (propToWidgetMap.size === 0) {
      node.widgets.forEach(widget => {
        if (widget.name && properties[widget.name] !== undefined) {
          propToWidgetMap.set(widget.name, widget);
        }
      });
    }

    // 最后尝试通过 widget.label 匹配属性名
    if (propToWidgetMap.size === 0) {
      node.widgets.forEach(widget => {
        if (widget.label) {
          const cleanLabel = widget.label.replace(/\([^)]*\)/g, '').trim();
          Object.keys(properties).forEach(propName => {
            if (propName === cleanLabel || propName.includes(cleanLabel) || cleanLabel.includes(propName)) {
              propToWidgetMap.set(propName, widget);
            }
          });
        }
      });
    }
  }

  // 如果没有 properties_info，从 widgets 自动推断控件类型
  if (propertiesInfo.length === 0 && Object.keys(properties).length > 0) {
    // 构建 widget 名 → widget 映射
    const widgetMap = {};
    if (node.widgets) {
      node.widgets.forEach(w => { if (w.name) widgetMap[w.name] = w; });
    }

    Object.keys(properties).forEach(propName => {
      if (propName.toLowerCase().includes("path")) return;

      const widget = widgetMap[propName];
      let autoConfig = {};

      if (widget) {
        // 从 widget 类型推断属性编辑器控件
        switch (widget.type) {
          case "combo":
            autoConfig.type = "select";
            autoConfig.values = (widget.options && widget.options.values) || [];
            break;
          case "toggle":
            autoConfig.type = "boolean";
            break;
          case "number":
            autoConfig.type = "number";
            if (widget.options) {
              if (widget.options.min !== undefined) autoConfig.min = widget.options.min;
              if (widget.options.max !== undefined) autoConfig.max = widget.options.max;
              if (widget.options.step !== undefined) autoConfig.step = widget.options.step;
            }
            break;
          case "button":
          case "preview_image":
            return; // 跳过按钮和预览
          default:
            autoConfig.type = "text";
        }
      }

      const propValue = widget ? widget.value ?? properties[propName] : properties[propName];
      const { container, input, type } = createPropertyInput(propName, propValue, autoConfig);
      listEl.appendChild(container);
      propertyInputs.set(propName, { input, type });
    });
  } else {
    // 使用 properties_info 生成，但结合 widget 类型适配
    propertiesInfo.forEach(propConfig => {
      // 跳过路径类型
      if (propConfig.type === "path" || propConfig.name.toLowerCase().includes("path")) return;

      const propName = propConfig.name;
      const propValue = properties[propName];

      // 查找匹配的 widget，确定最佳控件类型
      let effectiveConfig = { ...propConfig };
      const matchedWidget = propToWidgetMap.get(propName);
      if (matchedWidget) {
        // 用 widget 类型覆盖 properties_info 类型
        switch (matchedWidget.type) {
          case "combo":
            effectiveConfig.type = "select";
            effectiveConfig.values = (matchedWidget.options && matchedWidget.options.values) || propConfig.options || [];
            break;
          case "toggle":
            effectiveConfig.type = "boolean";
            break;
          case "number":
            effectiveConfig.type = "number";
            if (matchedWidget.options) {
              if (matchedWidget.options.min !== undefined) effectiveConfig.min = matchedWidget.options.min;
              if (matchedWidget.options.max !== undefined) effectiveConfig.max = matchedWidget.options.max;
              if (matchedWidget.options.step !== undefined) effectiveConfig.step = matchedWidget.options.step;
            }
            break;
          case "button":
          case "preview_image":
            return; // 跳过按钮和预览
          default:
            // 保留 properties_info 中的 type
            break;
        }
      }

      const { container, input, type } = createPropertyInput(propName, propValue, effectiveConfig);
      listEl.appendChild(container);
      propertyInputs.set(propName, { input, type });
    });
  }

  // 如果没有可编辑的属性
  if (propertyInputs.size === 0) {
    const noProps = document.createElement("div");
    noProps.textContent = "此节点没有可编辑的属性";
    noProps.style.cssText = "text-align:center;color:#666;padding:20px;";
    listEl.appendChild(noProps);
  }

  // ─── 动态说明 ───
  const helpEl = el.querySelector("#tf-property-help");
  function updateHelp() {
    if (!helpEl) return;
    if (typeof node.getHelpText === "function") {
      // 构建临时 properties 快照
      const snapshot = {};
      propertyInputs.forEach(({ input, type }, propName) => {
        switch (type) {
          case "number": snapshot[propName] = parseFloat(input.value); break;
          case "boolean": snapshot[propName] = input.checked; break;
          default: snapshot[propName] = input.value;
        }
      });
      // 合并原始属性（未在编辑器中显示的保留原值）
      const merged = { ...node.properties, ...snapshot };
      const text = node.getHelpText(merged);
      if (text) {
        helpEl.innerHTML = text;
        helpEl.style.display = "block";
        return;
      }
    }
    helpEl.style.display = "none";
  }

  // 输入变化时刷新说明
  propertyInputs.forEach(({ input }) => {
    input.addEventListener("change", updateHelp);
    input.addEventListener("input", updateHelp);
  });
  updateHelp();

  return new Promise(resolve => {
    let close = (save = false) => {
      el.style.display = "none";
      okBtn.onclick = null;
      cancelBtn.onclick = null;
      el.onclick = null;

      if (save) {
        // 保存属性值
        propertyInputs.forEach(({ input, type }, propName) => {
          let value;
          switch (type) {
            case "number":
              value = parseFloat(input.value);
              break;
            case "boolean":
              value = input.checked;
              break;
            default:
              value = input.value;
          }
          node.properties[propName] = value;
        });

        // 更新节点状态
        node.setDirtyCanvas?.(true, true);

        // 更新 widgets - 使用预构建的映射
        if (node.widgets && propToWidgetMap) {
          propertyInputs.forEach(({ input, type }, propName) => {
            const widget = propToWidgetMap.get(propName);
            if (widget) {
              widget.value = node.properties[propName];
              // 触发widget的回调以更新内部状态
              if (widget.callback) {
                try {
                  widget.callback(node.properties[propName]);
                } catch (e) {
                  console.warn('Widget callback error:', e);
                }
              }
            }
          });
        }

        // 强制重绘节点和画布
        if (node.graph) {
          node.graph.setDirtyCanvas(true, true);
        }

        // 额外强制节点重绘
        if (node.setDirtyCanvas) {
          node.setDirtyCanvas(true, true);
        }

        // 强制整个画布重绘
        if (node.graph && node.graph.canvas) {
          node.graph.canvas.draw(true, true);
        }

        resolve(true);
      } else {
        resolve(false);
      }
    };

    el.style.display = "flex";

    okBtn.onclick = () => close(true);
    cancelBtn.onclick = () => close(false);
    el.onclick = evt => {
      if (evt.target === el) close(false);
    };

    // ESC 键取消
    const handleKeyDown = evt => {
      if (evt.key === "Escape") close(false);
      if (evt.key === "Enter" && evt.ctrlKey) close(true);
    };
    document.addEventListener("keydown", handleKeyDown);

    // 清理事件监听器
    const originalClose = close;
    close = (save = false) => {
      document.removeEventListener("keydown", handleKeyDown);
      return originalClose(save);
    };
  });
}


// ── core/workflow-controller.js ──
// core/workflow-controller.js

/**
 * 图驱动执行控制器
 * 不再构建线性序列，节点通过 execOutput 直接 await 驱动下游，
 * 支持分支、循环、条件跳转，日志天然按执行顺序排列。
 */

class WorkflowController {
  constructor(getGraph) {
    this.getGraph = getGraph;
    this.state = STATE.IDLE;
    this.currentNode = null;
    this.currentLink = null;
    this.errorNode = null;
    this.nodeTimeout = 60000;
    this.nodeExecutionStartTime = null;
    this.timeoutCheckInterval = null;
    this._startTimeoutChecker();
    this._registerExecOutput();
  }

  /**
   * 给所有 LGraphNode 挂载 execOutput 方法
   * 用 queueMicrotask 断开调用栈，防止循环死递归
   */
  _registerExecOutput() {
    if (LGraphNode.prototype._execOutputRegistered) return;
    LGraphNode.prototype._execOutputRegistered = true;

    LGraphNode.prototype.execOutput = async function (slot) {
      const output = this.outputs?.[slot];
      if (!output?.links?.length) return;
      const graph = this.graph;
      if (!graph) return;
      const ctrl = window.workflowController;
      if (!ctrl || ctrl.state !== STATE.RUNNING) return;

      for (const linkId of output.links) {
        const link = graph.links[linkId];
        if (!link) continue;
        const target = graph._nodes.find(n => n.id === link.target_id);
        if (!target?.onAction) continue;
        // 断开栈，防止循环中的递归栈溢出
        await new Promise(r => queueMicrotask(r));
        await ctrl._runNode(target, "flow", link.target_slot);
      }
    };
  }

  setState(state) {
    this.state = state;
    window.updateControlUI?.(state);
    window.updateRuntimeState?.(state);
  }

  async start() {
    if (this.state === STATE.RUNNING) return false;
    const startNode = this._findStartNode();
    if (!startNode) return false;
    this.setState(STATE.RUNNING);
    // 从起点驱动整条链路，执行完成后 finish
    await this._runNode(startNode, "flow");
    if (this.state === STATE.RUNNING) this.finish();
    return true;
  }

  pause() {
    if (this.state !== STATE.RUNNING) return;
    this.setState(STATE.PAUSED);
  }

  resume() {
    if (this.state !== STATE.PAUSED) return;
    this.setState(STATE.RUNNING);
    // resume 后当前节点继续执行（在 waitUntilRunnable 中等待）
  }

  stop() {
    if (this.state === STATE.STOPPED || this.state === STATE.IDLE) return;
    this.setState(STATE.STOPPED);
    this.currentNode = null;
    this.currentLink = null;
    this.errorNode = null;
    window.updateCurrentNode?.(null);
    window.highlightLink?.(null);
    window.highlightErrorNode?.(null);
  }

  finish() {
    if (this.state === STATE.FINISHED || this.state === STATE.STOPPED) return;
    this.setState(STATE.FINISHED);
    this.currentNode = null;
    this.currentLink = null;
    this.errorNode = null;
    window.updateCurrentNode?.(null);
    window.highlightLink?.(null);
    window.highlightErrorNode?.(null);
  }

  // ==================== 节点执行 ====================

  async _runNode(node, action, targetSlot) {
    if (!node || this.state !== STATE.RUNNING) return;

    // 暂停等待
    while (this.state === STATE.PAUSED) {
      await new Promise(r => setTimeout(r, 80));
    }
    if (this.state !== STATE.RUNNING) return;

    this.currentNode = node;
    this.nodeExecutionStartTime = Date.now();
    window.updateCurrentNode?.(node);
    window.highlightNode?.(node);

    // 节点延迟
    const delay = window.getNodeDelay?.() || 0;
    if (delay > 0) await new Promise(r => setTimeout(r, delay));

    try {
      await node.onAction?.(action, null, null, targetSlot);
    } catch (err) {
      console.error(`[Workflow] 节点 ${node.title} 失败:`, err);
      window.unhighlightNode?.(node);
      this.setErrorNode(node);
      this.stop();
      window.showToast?.(`节点 ${node.title} 执行失败: ${err.message}`, "error");
      return;
    }

    // 执行完成后清理
    this.nodeExecutionStartTime = null;
    this.currentNode = null;
    window.unhighlightNode?.(node);
    window.highlightLink?.(null);
    this.currentLink = null;
    window.updateCurrentNode?.(null);
  }

  // ==================== 工具 ====================

  waitUntilRunnable() {
    return this.state === STATE.RUNNING;
  }

  startRequest() {
    this.nodeExecutionStartTime = Date.now();
  }

  endRequest() {
    this.nodeExecutionStartTime = null;
  }

  setErrorNode(node) {
    this.errorNode = node;
    window.highlightErrorNode?.(node);
  }

  clearErrorNode() {
    this.errorNode = null;
    window.highlightErrorNode?.(null);
  }

  checkNodeTimeout() {
    if (this.nodeExecutionStartTime && this.state === STATE.RUNNING) {
      const elapsed = Date.now() - this.nodeExecutionStartTime;
      if (elapsed > this.nodeTimeout) {
        throw new Error(`节点执行超时: ${elapsed}ms > ${this.nodeTimeout}ms`);
      }
    }
  }

  _startTimeoutChecker() {
    this.timeoutCheckInterval = setInterval(() => {
      if (this.state === STATE.RUNNING) {
        try {
          this.checkNodeTimeout();
        } catch (err) {
          console.error(err);
          if (this.currentNode) this.setErrorNode(this.currentNode);
          this.stop();
          window.showToast?.(`超时错误: ${err.message}`, "error");
        }
      }
    }, 1000);
  }

  _stopTimeoutChecker() {
    if (this.timeoutCheckInterval) {
      clearInterval(this.timeoutCheckInterval);
      this.timeoutCheckInterval = null;
    }
  }

  _findStartNode() {
    const graph = this.getGraph?.();
    if (!graph) return null;
    const node = graph._nodes.find(n => n.type === "flow/start");
    if (!node) {
      window.showToast?.("未找到 Start 节点", "error");
      this.setState(STATE.IDLE);
    }
    return node;
  }
}

const STATE = {
  IDLE: "idle",
  RUNNING: "running",
  PAUSED: "paused",
  STOPPED: "stopped",
  FINISHED: "finished",
};


// ── core/action-node.js ──

class ActionNode extends LiteGraph.LGraphNode {
  constructor(title) {
    super();
    this.title = title;
  }

  _controller() {
    return window.workflowController;
  }

  _backend() {
    return window.taskflow?.backend;
  }

  async callBackend(taskName, properties, timeout = 30000) {
    const backend = this._backend();
    if (!backend) throw new Error("Taskflow backend is not ready");
    const propertiesWithAccount = window.accountManager?.addAccountToParams(properties) || properties;
    const controller = this._controller();
    controller?.startRequest?.();
    const response = await backend.invoke(taskName, propertiesWithAccount, timeout);
    if (response?.data?.error) {
      const m = response.data.error;
      if (m.includes("连接已断开") || m.includes("Target closed") || m.includes("has been closed")) {
        throw new Error(m);
      }
    }
    return response;
  }

  async run(action) {
    if (action && action !== "trigger" && action !== "flow") return;

    const canRun = await this._waitControllerReady();
    if (!canRun) return;

    this._controller()?.onNodeStart?.(this);
    await reportNodeEvent(this, "start", { action });

    try {
      await this.onRun();
      await reportNodeEvent(this, "success");
      // 执行完成后驱动 slot 0（下一步）
      // 非 ActionNode 子类可覆盖此行为
      await this.execOutput(0);
    } catch (error) {
      await reportNodeEvent(this, "error", { message: error.message || String(error) });
      console.error(`[${this.title}]`, error);
      window.showToast?.(`${this.title} 执行失败: ${error.message}`, "error");
      this._controller()?.stop();
    } finally {
      this._controller()?.onNodeFinish?.(this);
    }
  }

  async onRun() {}

  async _waitControllerReady() {
    const ctrl = this._controller();
    if (!ctrl) return false;
    while (ctrl.state === "paused") {
      await new Promise(r => setTimeout(r, 80));
    }
    return ctrl.state === "running";
  }

  log(message, level = "info") {
    const title = this.title || this.constructor.title || "节点";
    window.taskflowLog?.(level, `[${title}] ${message}`);
  }
}

function updateTabWidths() {
  const tabBtns = tabs.map(t => t.btn);
  const count = tabBtns.length;
  const totalBarWidth = tabBar.clientWidth - 10;
  const newBtnWidth = newTabBtn.offsetWidth;
  const MAX_TAB_WIDTH = totalBarWidth * 0.25;

  let width = (totalBarWidth - newBtnWidth - (count-1)*2) / count;
  width = Math.max(MIN_TAB_WIDTH, Math.min(width, MAX_TAB_WIDTH));

  tabBtns.forEach(btn => btn.style.width = width + "px");
}

// ── js/drag.js ──

function setupDrag(btn, tabObj) {

  btn.addEventListener("mousedown", e => {

    let offsetX = 0;
    let placeholder = null;

    let cachedRects = [];
    let siblings = [];

    let lastX = e.clientX;
    let startX = e.clientX;
    let startY = e.clientY;
    let isDragging = false;

    const rect = btn.getBoundingClientRect();
    offsetX = e.clientX - rect.left;

    function startDrag() {
      isDragging = true;
      setDraggedTab(tabObj);

      placeholder = document.createElement("div");
      placeholder.className = "placeholder";
      placeholder.style.width = rect.width + "px";
      placeholder.style.height = rect.height + "px";

      tabBar.insertBefore(placeholder, btn.nextSibling);

      btn.classList.add("dragging");
      btn.style.position = "absolute";
      btn.style.left = rect.left + "px";
      btn.style.top = rect.top + "px";
      btn.style.width = rect.width + "px";
      btn.style.pointerEvents = "none";
      btn.style.zIndex = 1000;

      updateCache();
    }

    function updateCache() {
      siblings = [...tabBar.children].filter(el =>
        el !== btn && el !== newTabBtn
      );
      cachedRects = siblings.map(el => el.getBoundingClientRect());
    }

    function animateSwap() {
      const elements = [...tabBar.children].filter(el =>
        el !== btn && el !== newTabBtn
      );

      const rects = elements.map(el => el.getBoundingClientRect());

      requestAnimationFrame(() => {
        elements.forEach((el, i) => {
          const newRect = el.getBoundingClientRect();
          const dx = rects[i].left - newRect.left;

          if (dx !== 0) {
            el.style.transition = "none";
            el.style.transform = `translateX(${dx}px)`;

            requestAnimationFrame(() => {
              el.style.transition = "transform 0.3s cubic-bezier(0.22,1,0.36,1)";
              el.style.transform = "";
            });
          }
        });
      });
    }

    function updatePosition() {
      const x = lastX - offsetX;
      btn.style.left = x + "px";

      const center = x + btn.offsetWidth / 2;
      const movingRight = lastX > prevX;

      const children = [...tabBar.children].filter(el =>
        el !== btn && el !== newTabBtn
      );

      const index = children.indexOf(placeholder);

      if (movingRight) {
        const next = children[index + 1];
        if (!next) return;

        const rect = next.getBoundingClientRect();
        if (center > rect.left + rect.width / 2) {
          animateSwap();
          tabBar.insertBefore(placeholder, next.nextSibling);
          updateCache();
        }

      } else {
        const prev = children[index - 1];
        if (!prev) return;

        const rect = prev.getBoundingClientRect();
        if (center < rect.left + rect.width / 2) {
          animateSwap();
          tabBar.insertBefore(placeholder, prev);
          updateCache();
        }
      }
    }

    let prevX = lastX;

    function onMove(e) {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      // ⚡ 拖拽触发条件：水平移动大于5px，且水平移动大于垂直移动
      if (!isDragging && Math.abs(dx) > 5 && Math.abs(dx) > Math.abs(dy)) {
        startDrag();
      }
      if (!isDragging) return;

      prevX = lastX;
      lastX = e.clientX;

      updatePosition();
    }

    function onUp() {
  if (isDragging) {
    // 计算 placeholder 的位置
    const rect = placeholder.getBoundingClientRect();

    btn.style.transition = "all 0.25s";
    btn.style.left = rect.left + "px";
    btn.style.top = rect.top + "px";

    setTimeout(() => {
      // 把按钮放回正确位置
      if (placeholder.parentNode === tabBar) {
        tabBar.insertBefore(btn, placeholder);
        placeholder.remove();
      }

      // 清理样式和类
      btn.style.transition = "";
      btn.style.position = "";
      btn.style.left = "";
      btn.style.top = "";
      btn.style.width = "";
      btn.style.pointerEvents = "";
      btn.style.zIndex = "";
      btn.classList.remove("dragging");

      const newOrder = [...tabBar.children]
        .filter(el => el.classList.contains("tab-btn"))
        .map(el => el.dataset.tabId);

      tabs.sort((a, b) =>
        newOrder.indexOf(a.id) - newOrder.indexOf(b.id)
      );

      updateTabWidths();
    }, 250);
  }

  isDragging = false;
  setDraggedTab(null);
  document.removeEventListener("mousemove", onMove);
  document.removeEventListener("mouseup", onUp);
}

    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);

  });
}

// ── core/node-panel.js ──
// taskflow/core/node-panel.js

const panel = document.getElementById("node-panel");
const toggleBtn = document.getElementById("panel-toggle");

toggleBtn.addEventListener("click", () => {
  panel.classList.toggle("collapsed");
});

/* ---------- 频率统计 ---------- */

const FREQ_KEY = "taskflow_node_frequency";
let nodeFrequency = {};

function loadFrequency() {
  try {
    const raw = localStorage.getItem(FREQ_KEY);
    nodeFrequency = raw ? JSON.parse(raw) : {};
  } catch {
    nodeFrequency = {};
  }
}

function saveFrequency() {
  try {
    localStorage.setItem(FREQ_KEY, JSON.stringify(nodeFrequency));
  } catch { /* ignore */ }
}

function recordNodeUse(nodeType) {
  nodeFrequency[nodeType] = (nodeFrequency[nodeType] || 0) + 1;
  saveFrequency();
}

function getFrequency(type) {
  return nodeFrequency[type] || 0;
}

/* ---------- 状态 ---------- */

function getSortMode() {
  const el = document.getElementById("toggle-sort-mode");
  return el?.checked ? "name" : "frequency";
}

function getCatMode() {
  const el = document.getElementById("toggle-category-mode");
  return el?.checked ? "categorized" : "flat";
}

/* ---------- 渲染 ---------- */

function initNodePanel() {
  loadFrequency();

  const panelBody = document.getElementById("panel-body");
  if (!panelBody) {
    console.error("[NodePanel] 找不到panel-body元素");
    return;
  }

  // 绑定toggle事件
  document.getElementById("toggle-sort-mode")?.addEventListener("change", render);
  document.getElementById("toggle-category-mode")?.addEventListener("change", render);

  // 延迟一帧等待DOM稳定
  setTimeout(render, 100);
}

function render() {
  const panelBody = document.getElementById("panel-body");
  if (!panelBody) return;

  const sortMode = getSortMode();
  const catMode = getCatMode();

  const nodeTypes = LiteGraph.registered_node_types;
  const myNodes = getMyNodes(nodeTypes);
  const entries = buildEntries(myNodes);

  // 排序
  sortEntries(entries, sortMode);

  panelBody.innerHTML = "";

  if (catMode === "categorized") {
    renderCategorized(panelBody, entries, sortMode);
  } else {
    renderFlat(panelBody, entries, sortMode);
  }
}

/* ---------- 构建节点列表 ---------- */

function buildEntries(nodes) {
  const result = [];
  for (const type in nodes) {
    const cls = nodes[type];
    result.push({
      type,
      title: cls.title || type.split("/").slice(1).join("/"),
      category: type.split("/")[0],
      freq: getFrequency(type),
    });
  }
  return result;
}

/* ---------- 排序 ---------- */

function sortEntries(entries, sortMode) {
  if (sortMode === "frequency") {
    entries.sort((a, b) => {
      if (b.freq !== a.freq) return b.freq - a.freq;
      return a.title.localeCompare(b.title);
    });
  } else {
    entries.sort((a, b) => a.title.localeCompare(b.title));
  }
}

/* ---------- 分类渲染 ---------- */

function renderCategorized(container, entries, sortMode) {
  const categories = collectCategories(entries);

  categories.forEach(cat => {
    const catEntries = entries.filter(e => e.category === cat);
    if (!catEntries.length) return;

    const wrap = document.createElement("div");
    wrap.className = "category";

    const title = document.createElement("div");
    title.className = "category-title";
    const displayName = formatCategoryName(cat);
    title.innerHTML = `<span>${displayName}</span><span>▾</span>`;
    title.addEventListener("click", () => {
      wrap.classList.toggle("collapsed");
      const arrow = title.querySelector("span:last-child");
      arrow.textContent = wrap.classList.contains("collapsed") ? "▸" : "▾";
    });

    const content = document.createElement("div");
    content.className = "category-content";

    catEntries.forEach(entry => {
      content.appendChild(createNodeButton(entry, sortMode));
    });

    wrap.appendChild(title);
    wrap.appendChild(content);
    container.appendChild(wrap);
  });
}

/* ---------- 不分类渲染 ---------- */

function renderFlat(container, entries, sortMode) {
  entries.forEach(entry => {
    container.appendChild(createNodeButton(entry, sortMode));
  });
}

/* ---------- 创建节点按钮 ---------- */

function createNodeButton(entry, sortMode) {
  const btn = document.createElement("button");
  btn.className = "node-button";

  if (sortMode === "frequency") {
    // 显示频率标记
    const freq = entry.freq;
    const freqBadge = freq > 0 ? ` <span class="node-freq-badge">${freq}</span>` : "";
    btn.innerHTML = `${entry.title}${freqBadge}`;
  } else {
    btn.textContent = entry.title;
  }

  btn.addEventListener("mousedown", (e) => {
    e.preventDefault();
    const tab = currentTab;
    if (!tab) return;

    const graph = tab.graph;
    const canvas = tab.graphCanvas;
    if (!graph || !canvas) return;

    const node = LiteGraph.createNode(entry.type);
    if (!node) return;

    const viewport = canvas.visible_area;
    const cx = viewport[0] + viewport[2] / 2;
    const cy = viewport[1] + viewport[3] / 2;
    node.pos = [cx - 50, cy - 25];

    graph.add(node);
    canvas.centerOnNode(node);

    // 记录频率并重新渲染
    recordNodeUse(entry.type);
    // 直接更新频率数字，避免全量重排闪烁
    const freqEl = btn.querySelector(".node-freq-badge");
    if (freqEl) {
      freqEl.textContent = getFrequency(entry.type);
    } else if (sortMode === "frequency") {
      btn.innerHTML = `${entry.title} <span class="node-freq-badge">${getFrequency(entry.type)}</span>`;
    }
    // 全量重渲染（确保排序更新）
    // 改为节流，避免频繁重绘
    scheduleRender();
  });

  return btn;
}

let _renderTimer = null;

function scheduleRender() {
  if (_renderTimer) return;
  _renderTimer = setTimeout(() => {
    _renderTimer = null;
    render();
  }, 500);
}

/* ---------- 辅助函数 ---------- */

function getMyNodes(nodeTypes) {
  return Object.fromEntries(
    Object.entries(nodeTypes).filter(([type]) =>
      type.startsWith("flow/") ||
      type.startsWith("action/") ||
      type.startsWith("mnsg/") ||
      type.startsWith("test/")
    )
  );
}

function collectCategories(entries) {
  const set = new Set(entries.map(e => e.category));
  const CATEGORY_ORDER = ["flow", "action", "mnsg", "test"];
  const result = [];
  for (const cat of CATEGORY_ORDER) {
    if (set.has(cat)) result.push(cat);
  }
  for (const cat of set) {
    if (!CATEGORY_ORDER.includes(cat)) result.push(cat);
  }
  return result;
}

const CATEGORY_NAME_MAP = {
  flow: "流程",
  action: "操作",
  mnsg: "MNSG",
  test: "测试",
};

function formatCategoryName(category) {
  return CATEGORY_NAME_MAP[category] || category;
}

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    document.body.style.userSelect = "none";
  });

  document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    panel.style.left = e.clientX - offsetX + "px";
    panel.style.top = e.clientY - offsetY + "px";
  });

  document.addEventListener("mouseup", () => {
    isDragging = false;
    document.body.style.userSelect = "";
  });
})();

// taskflow/core/runtime-panel.js

function initRuntimePanel() {
  const panel = document.getElementById("runtime-panel");
  const header = document.getElementById("runtime-drag");
  let dragging = false, offsetX = 0, offsetY = 0;

  header.addEventListener("mousedown", e => {
    if (e.target.tagName === "BUTTON") return;
    dragging = true;
    const rect = panel.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    panel.style.transition = "none";
  });

  document.addEventListener("mousemove", e => {
    if (!dragging) return;

    const panelWidth = panel.offsetWidth;
    const panelHeight = panel.offsetHeight;
    const maxX = window.innerWidth - panelWidth;
    const maxY = window.innerHeight - panelHeight;

    let x = e.clientX - offsetX;
    let y = e.clientY - offsetY;

    x = Math.max(0, Math.min(x, maxX));
    y = Math.max(0, Math.min(y, maxY));

    panel.style.left = `${x}px`;
    panel.style.top = `${y}px`;
  });

  document.addEventListener("mouseup", () => {
    if (dragging) {
      dragging = false;
      panel.style.transition = "transform 0.2s ease, height 0.25s ease, box-shadow 0.2s ease";
    }
  });

  // ===== 控制按钮 =====
  const btnStart = document.getElementById("btn-start");
  const btnPause = document.getElementById("btn-pause");
  const btnResume = document.getElementById("btn-resume");
  const btnStop = document.getElementById("btn-stop");

  // ===== 新增运行状态管理 =====
  let runState = STATE.IDLE;

  function updateRunButtons() {
    // 清除所有 active 样式
    [btnStart, btnPause, btnResume, btnStop].forEach(btn => btn.classList.remove("active"));

    // 默认禁用所有按钮
    btnStart.disabled = true;
    btnPause.disabled = true;
    btnResume.disabled = true;
    btnStop.disabled = true;

    switch (runState) {
      case STATE.RUNNING:
        btnStart.classList.add("active");
        btnStart.disabled = true;
        btnPause.disabled = false;
        btnResume.disabled = true;
        btnStop.disabled = false;
        break;

      case STATE.PAUSED:
        btnPause.classList.add("active");
        btnStart.disabled = false;
        btnPause.disabled = true;
        btnResume.disabled = false;
        btnStop.disabled = false;
        break;

      case STATE.STOPPED:
      case STATE.FINISHED:
        btnStop.classList.add("active");
        btnStart.disabled = false;
        btnPause.disabled = true;
        btnResume.disabled = true;
        btnStop.disabled = true;
        break;

      case STATE.IDLE:
        btnStart.disabled = false;
        btnPause.disabled = true;
        btnResume.disabled = true;
        btnStop.disabled = true;
        break;
    }
  }

  function getController() {
    return window.workflowController;
  }

  btnStart.onclick = async () => {
    await getController()?.start();
    // 状态由workflow-controller管理，通过updateRuntimeState更新
  };
  btnPause.onclick = () => {
    getController()?.pause();
    // 状态由workflow-controller管理，通过updateRuntimeState更新
  };
  btnResume.onclick = () => {
    getController()?.resume();
    // 状态由workflow-controller管理，通过updateRuntimeState更新
  };
  btnStop.onclick = () => {
    getController()?.stop();
    // 状态由workflow-controller管理，通过updateRuntimeState更新
  };

  // ===== 状态显示 =====
  const runStateEl = document.getElementById("run-state");
  const currentNodeEl = document.getElementById("current-node");
  const stateText = {
    [STATE.IDLE]: "空闲",
    [STATE.RUNNING]: "运行中",
    [STATE.PAUSED]: "暂停中",
    [STATE.STOPPED]: "已停止",
    [STATE.FINISHED]: "已完成",
  };

  window.updateRuntimeState = state => {
    runStateEl.innerText = stateText[state] || state;
    // 同步按钮状态
    runState = state;
    updateRunButtons();
  };

  window.updateCurrentNode = node => currentNodeEl.innerText = node?.title || "-";

  // ===== FPS更新 =====
  const fpsEl = document.getElementById("run-fps");
  const delayEl = document.getElementById("run-delay");

  function updateFPS() {
    const canvas = currentTab?.graphCanvas;
    if (canvas && canvas.fps !== undefined) {
      fpsEl.innerText = canvas.fps.toFixed(1);
    } else {
      fpsEl.innerText = "0";
    }

    // 更新延迟显示（后端响应延迟）
    const controller = window.workflowController;
    if (controller && controller.lastBackendDelay !== undefined) {
      delayEl.innerText = `${controller.lastBackendDelay}ms`;
    } else {
      delayEl.innerText = "0ms";
    }
  }

  // 每2秒更新一次FPS
  setInterval(updateFPS, 2000);

  // 初始化按钮状态
  updateRunButtons();
}

// ===== 模块级事件委托：折叠按钮 =====
// 使用 document 委托确保即使 initRuntimePanel 未执行也能正常工作
document.addEventListener("click", (e) => {
  const btn = e.target.closest("#runtime-toggle");
  if (!btn) return;

  const p = document.getElementById("runtime-panel");
  if (!p) return;

  const isCollapsed = p.classList.contains("collapsed");
  const COLLAPSED_H = 36;

  if (isCollapsed) {
    p.classList.remove("collapsed");
    const fullH = p.scrollHeight;
    p.classList.add("collapsed");
    p.style.height = COLLAPSED_H + "px";
    p.style.overflow = "hidden";
    void p.offsetHeight;
    p.classList.remove("collapsed");
    p.style.height = fullH + "px";
  } else {
    const curH = p.offsetHeight;
    p.style.height = curH + "px";
    p.style.overflow = "hidden";
    void p.offsetHeight;
    p.classList.add("collapsed");
    p.style.height = COLLAPSED_H + "px";
  }

  const cleanup = () => {
    p.style.height = "";
    p.style.overflow = "";
  };
  p.addEventListener("transitionend", cleanup, { once: true });
  setTimeout(cleanup, 300);
});

  // 文件选择器：加载任意位置的 .json 工作流
  fileInput.accept = ".json";
  fileInput.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      let tab = currentTab;
      if (!tab) {
        showToast("没有当前标签页，正在创建新标签页", "info");
        // (离线模式: createTab 已在 bundle 中)
        createTab();
        tab = currentTab;
        if (!tab) {
          showToast("创建标签页失败", "error");
          return;
        }
      }
      const graphData = JSON.parse(text);
      const graph = tab.graph;
      graph.clear();
      graph.configure(graphData);
      tab.graphCanvas.render_execution_order = showExecutionOrder;
      tab.graphCanvas.setDirty(true, true);
      showToast(`已加载：${file.name}`, "success");
    } catch (e) {
      showToast(`加载失败: ${e.message}`, "error");
    }
    // 关闭加载选择器（如果有）
    const picker = document.getElementById("workflow-picker");
    if (picker) picker.remove();
  };

  clearBtn.onclick = () => {
    const tab = currentTab;
    if (!tab) return;

    if (confirm("确定清空当前流程？")) {
      tab.graph.clear();
      showToast("已清空当前流程", "success");
    }
  };

  // 检查后端浏览器是否就绪
  async function checkBrowserReady() {
    const backend = window.taskflow?.backend;
    if (!backend) {
      return { ready: false, reason: "后端服务未连接" };
    }

    const ws = backend.wsManager?.ws;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      return { ready: false, reason: "与后端的WebSocket连接未建立" };
    }

    const account = backend.getCurrentTabAccount();
    if (!account || !account.email) {
      return { ready: false, reason: "当前标签页未绑定账号" };
    }

    // 快速检查浏览器状态（5秒超时）
    try {
      const response = await backend.invoke("account_operation", {
        operation: "get_status",
        parameters: {}
      }, 5000);

      const data = response?.data;
      if (data?.result?.has_browser) {
        return { ready: true, account };
      }
      return { ready: false, reason: `账号 "${account.name}" 的浏览器未启动，请先在主界面启动浏览器` };
    } catch {
      return { ready: false, reason: `账号 "${account.name}" 的浏览器未启动，请先在主界面启动浏览器` };
    }
  }

  // 显示模态警告弹窗
  function showWarningModal(message) {
    const existing = document.getElementById("warning-modal-overlay");
    if (existing) existing.remove();

    const overlay = document.createElement("div");
    overlay.id = "warning-modal-overlay";
    overlay.className = "warning-modal-overlay";

    overlay.innerHTML = `
      <div class="warning-modal">
        <div class="warning-modal-header">
          <span class="warning-icon">!</span>
          <span>警告</span>
        </div>
        <div class="warning-modal-body">${message}</div>
        <div class="warning-modal-footer">
          <button class="warning-modal-btn">确定</button>
        </div>
      </div>
    `;

    overlay.querySelector(".warning-modal-btn").onclick = () => overlay.remove();
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    document.body.appendChild(overlay);
  }

  btnStart.onclick = async () => {
    const check = await checkBrowserReady();
    if (!check.ready) {
      showWarningModal(check.reason);
      return;
    }

    const ctrl = getController();
    if (!ctrl) return;

    const ok = await ctrl.start();
    if (!ok) return;

    showToast("开始运行", "success");
  };

  btnPause.onclick = () => {
    const ctrl = getController();
    if (!ctrl) return;

    ctrl.pause();
    showToast("已暂停", "info");
    updateControlUI(ctrl.state);
  };

  btnResume.onclick = () => {
    const ctrl = getController();
    if (!ctrl) return;

    ctrl.resume();
    showToast("继续运行", "info");
    updateControlUI(ctrl.state);
  };

  btnStop.onclick = () => {
    const ctrl = getController();
    if (!ctrl) return;

    ctrl.stop();
    showToast("已停止", "warning");
    updateControlUI(ctrl.state);
  };

  // 节点顺序开关 — 拦截 label 默认行为防止浏览器双重触发
  const orderLabel = orderToggle?.closest("label");
  orderLabel?.addEventListener("click", e => {
    e.preventDefault();
    const newState = !orderToggle.checked;
    orderToggle.checked = newState;
    updateExecutionOrder(newState);
  });

  // 连线样式下拉
  // LiteGraph 命名与字面相反：STRAIGHT_LINK=直角折线，LINEAR_LINK=接近直线
  const LINK_STYLE_MAP = {
    spline: LiteGraph.SPLINE_LINK,
    straight: LiteGraph.LINEAR_LINK,
    linear: LiteGraph.STRAIGHT_LINK,
  };
  const LINK_STYLE_LABEL = {
    spline: "曲线",
    straight: "直线",
    linear: "直角线",
  };
  linkStyleSelect?.addEventListener("change", e => {
    const mode = LINK_STYLE_MAP[e.target.value];
    if (mode == null) return;
    applyLinkStyleState(mode);
    showToast(`连线样式: ${LINK_STYLE_LABEL[e.target.value]}`, "info");
  });

  nodeDelayInput?.addEventListener("input", e => {
    nodeDelay = parseInt(e.target.value) || 0;
  });

  window.updateControlUI = updateControlUI;

  setMode(currentMode);
  updateControlUI("idle");
  updateOrderToggleUI();

  if (currentTab?.controller) {
    updateControlUI(currentTab.controller.state);
  }
}

controlDrag.addEventListener("mousedown", e => {
  dragging = true;
  const rect = controlPanel.getBoundingClientRect();
  offsetX = e.clientX - rect.left;
  offsetY = e.clientY - rect.top;
  controlPanel.style.transition = "none";
});

document.addEventListener("mousemove", e => {
  if (!dragging) return;

  controlPanel.style.left = `${e.clientX - offsetX}px`;
  controlPanel.style.top = `${e.clientY - offsetY}px`;
});

document.addEventListener("mouseup", () => {
  if (!dragging) return;

  dragging = false;
  controlPanel.style.transition =
    "transform 0.2s ease, height 0.25s ease, box-shadow 0.2s ease";
});

controlToggle.addEventListener("click", () => {
  const isCollapsed = controlPanel.classList.contains("collapsed");
  const COLLAPSED_H = 32;

  if (isCollapsed) {
    // === 展开动画 ===
    controlPanel.classList.remove("collapsed");
    const fullH = controlPanel.scrollHeight;
    controlPanel.classList.add("collapsed");
    controlPanel.style.height = COLLAPSED_H + "px";
    controlPanel.style.overflow = "hidden";
    void controlPanel.offsetHeight;
    controlPanel.classList.remove("collapsed");
    controlPanel.style.height = fullH + "px";
  } else {
    // === 折叠动画 ===
    const curH = controlPanel.offsetHeight;
    controlPanel.style.height = curH + "px";
    controlPanel.style.overflow = "hidden";
    void controlPanel.offsetHeight;
    controlPanel.classList.add("collapsed");
    controlPanel.style.height = COLLAPSED_H + "px";
  }

  const cleanup = () => {
    controlPanel.style.height = "";
    controlPanel.style.overflow = "";
  };
  controlPanel.addEventListener("transitionend", cleanup, { once: true });
  setTimeout(cleanup, 300);
});

class TaskflowBackend {
  constructor(wsManager) {
    this.wsManager = wsManager;
    this.defaultAccount = "default";
    this.httpPort = 8010; // HTTP端口
  }

  setAccount(account) {
    this.defaultAccount = account || "default";
  }

  async invoke(taskName, properties = {}, timeout = 30000) {
    // 直接使用WebSocket连接
    const tabAccount = this.getCurrentTabAccount();
    console.log(`[TaskflowBackend] 使用WebSocket调用任务: ${taskName}`);
    console.log(`[TaskflowBackend] 账号: ${tabAccount?.email || this.defaultAccount}`);

    return await this._invokeViaWebSocket(taskName, properties, timeout);
  }

  async _invokeViaWebSocket(taskName, properties = {}, timeout = 30000) {
    console.log(`[TaskflowBackend] 调用任务: ${taskName}`);

    // 从当前活跃的tab获取账号信息
    const currentTabAccount = this.getCurrentTabAccount();

    // 确保 properties 中包含 account 信息（Python 后端从 props 中读取 account）
    const propsWithAccount = { ...properties };
    if (!propsWithAccount.account && currentTabAccount.email !== 'default@example.com') {
      propsWithAccount.account = currentTabAccount;
    }

    const form = Message.createEmptyTask();
    form.meta.account = currentTabAccount.email;
    form.task.task_name = taskName;
    form.task.properties = propsWithAccount;
    form.task.timeout = timeout;

    Message.validate(form);
    
    const response = await this.wsManager.sendTask(form);
    console.log(`[TaskflowBackend] 任务完成: ${taskName}`);
    return response;
  }

  getCurrentTabAccount() {
    try {
      // 获取当前活跃的tab
      const currentTab = window.currentTab;
      
      if (currentTab && currentTab.account) {
        return currentTab.account;
      }
      
      // 如果当前tab没有账号信息，尝试从其他tab获取
      const tabs = window.tabs || [];
      for (const tab of tabs) {
        if (tab.account && tab.account.email) {
          return tab.account;
        }
      }
      
      // 最后回退到全局accountInfo
      if (window.accountInfo && window.accountInfo.email) {
        return window.accountInfo;
      }
      
      // 最后回退到默认账号
      return { name: 'default', email: 'default@example.com' };
      
    } catch (error) {
      console.error(`[TaskflowBackend] 获取账号失败:`, error);
      return { name: 'default', email: 'default@example.com' };
    }
  }
}

// core/account-api.js

class AccountAPI {
  constructor(backend) {
    this.backend = backend;
  }

  /**
   * 执行账号特定操作
   * @param {string} operation - 操作类型
   * @param {Object} parameters - 操作参数
   * @param {Object} account - 账号信息 (可选，默认使用当前账号)
   * @returns {Promise<Object>} 操作结果
   */
  async executeAccountOperation(operation, parameters = {}, account = null) {
    const targetAccount = account || accountManager.getCurrentAccount();
    
    if (!targetAccount) {
      throw new Error('没有指定账号或当前账号为空');
    }

    const props = {
      account: targetAccount,
      operation,
      parameters
    };

    console.log(`[AccountAPI] 执行账号操作: ${targetAccount.name} -> ${operation}`);
    
    return await this.backend.invoke('account_operation', props);
  }

  /**
   * 启动账号浏览器
   * @param {Object} account - 账号信息 (可选)
   * @returns {Promise<Object>} 操作结果
   */
  async startBrowser(account = null) {
    return await this.executeAccountOperation('start_browser', {}, account);
  }

  /**
   * 停止账号浏览器
   * @param {Object} account - 账号信息 (可选)
   * @returns {Promise<Object>} 操作结果
   */
  async stopBrowser(account = null) {
    return await this.executeAccountOperation('stop_browser', {}, account);
  }

  /**
   * 重启账号浏览器
   * @param {Object} account - 账号信息 (可选)
   * @returns {Promise<Object>} 操作结果
   */
  async restartBrowser(account = null) {
    return await this.executeAccountOperation('restart_browser', {}, account);
  }

  /**
   * 获取账号状态
   * @param {Object} account - 账号信息 (可选)
   * @returns {Promise<Object>} 账号状态
   */
  async getAccountStatus(account = null) {
    return await this.executeAccountOperation('get_status', {}, account);
  }

  /**
   * 为账号执行脚本
   * @param {string} script - 脚本内容或路径
   * @param {Object} account - 账号信息 (可选)
   * @returns {Promise<Object>} 执行结果
   */
  async executeScript(script, account = null) {
    return await this.executeAccountOperation('execute_script', { script }, account);
  }

  /**
   * 为账号截图
   * @param {Object} account - 账号信息 (可选)
   * @returns {Promise<Object>} 截图结果
   */
  async takeScreenshot(account = null) {
    return await this.executeAccountOperation('take_screenshot', {}, account);
  }

  /**
   * 批量操作多个账号
   * @param {Array} operations - 操作数组 [{account, operation, parameters}]
   * @returns {Promise<Array>} 批量操作结果
   */
  async executeBatchOperations(operations) {
    const promises = operations.map(({ account, operation, parameters }) => 
      this.executeAccountOperation(operation, parameters, account)
    );
    
    return await Promise.all(promises);
  }

  /**
   * 获取所有账号状态
   * @param {Array} accounts - 账号列表
   * @returns {Promise<Array>} 所有账号状态
   */
  async getAllAccountsStatus(accounts = null) {
    const targetAccounts = accounts || accountManager.getAllAccounts();
    
    const operations = targetAccounts.map(account => ({
      account,
      operation: 'get_status',
      parameters: {}
    }));
    
    return await this.executeBatchOperations(operations);
  }
}

/**
 * Fix tab.js: use dynamic getTabBar() instead of cached import reference.
 * The cached tabBar from state.js can become stale if the DOM element is replaced.
 */

function getTabBar() {
  return document.getElementById("tab-bar");
}

function createTab(customTitle = null) {

  // 检查是否已存在相同标题的tab
  if (customTitle) {
    const existingTab = tabs.find(tab =>
      tab.btn.querySelector('span')?.textContent === customTitle
    );
    if (existingTab) {
      console.log(`[Tab] 已存在相同标题的tab: ${customTitle}，跳过创建`);
      switchTab(existingTab.id);
      return existingTab;
    }
  }

  const tabId = "tab" + (tabs.length + 1);

  const btn = document.createElement("button");
  btn.className = "tab-btn";
  btn.dataset.tabId = tabId;
  btn.onclick = () => switchTab(tabId);

  const span = document.createElement("span");

  console.log(`[Tab] createTab called with customTitle:`, customTitle);

  // 如果有自定义标题，使用自定义标题，否则使用默认标题
  if (customTitle) {
    span.textContent = customTitle;
    console.log(`[Tab] Using custom title: ${customTitle}`);
  } else {
    span.textContent = "Tab " + (tabs.length + 1);
    console.log(`[Tab] Using default title: Tab ${tabs.length + 1}`);
  }

  btn.appendChild(span);

  // ===== 重命名 =====
  span.addEventListener("dblclick", (e) => {
    e.stopPropagation();

    const oldText = span.textContent;
    const input = document.createElement("input");

    input.value = oldText;
    input.style.width = "80%";

    btn.replaceChild(input, span);
    input.focus();

    input.onblur = () => {
      span.textContent = input.value || oldText;
      btn.replaceChild(span, input);
    };
  });

  // ===== 关闭 =====
  const closeBtn = document.createElement("button");
  closeBtn.className = "tab-close";
  closeBtn.textContent = "×";
  closeBtn.onclick = e => {
    e.stopPropagation();
    closeTab(tabId);
  };
  btn.appendChild(closeBtn);

  // 确保tab插入到+号按钮前面
  insertTabButton(btn, tabId);

  // ===== canvas =====
  const canvas = document.createElement("canvas");
  canvas.id = tabId;

  canvasContainer.appendChild(canvas);
  resizeCanvas(canvas);
  setTimeout(() => resizeCanvas(canvas), 0);

  const graph = new LGraph();
  const graphCanvas = new LGraphCanvas(canvas, graph);
  graphCanvas.render_connection_arrows = false; // 关闭连线上的箭头
  graphCanvas.render_link_tooltip = false;      // 关闭连线中点的悬停圆点（点击连接线菜单入口）

  // 全局关闭 widget 弹出式菜单/编辑器，所有修改走属性编辑器（双击节点）
  LiteGraph.disable_combo_menu = true;          // combo 下拉菜单
  LiteGraph.disable_inline_editor = true;       // string/text 内联编辑

  graph.checkWorkflowStop = function(node, canvas) {

      let hasNext = false;
      for (let output of node.outputs) {
          if (output.links && output.links.length > 0) {
              hasNext = true;
              break;
          }
      }

      if (!hasNext) {
          console.log(`节点 ${node.title || node.id} 没有下一节点，停止执行`);
          if (canvas) canvas.stop();
          return true;
      }

      return false;
  };

  graphCanvas.onShowNodePanel = function(node) {
      console.log("已拦截打开节点面板:", node.title);
  };

  // graphCanvas.onNodeDblClicked = function(node) {
  //     console.log("双击事件:", node.title);
  // };

  // ===== 模式监听（核心）=====
  window.addEventListener("modeChange", e => {
    const mode = e.detail;

    switch (mode) {
      case "pan":
        graphCanvas.allow_dragcanvas = true;
        graphCanvas.allow_interaction = false;
        break;

      case "select":
        graphCanvas.allow_dragcanvas = true;
        graphCanvas.allow_interaction = true;
        break;

      case "readonly":
        graphCanvas.allow_dragcanvas = false;
        graphCanvas.allow_interaction = false;
        break;
    }
  });

  const mode = window.getCurrentMode?.() || "select";
  window.dispatchEvent(new CustomEvent("modeChange", { detail: mode }));

  // 绑定账号信息到tab
  const accountInfo = window.accountInfo || { name: 'default', email: 'default@example.com' };
  console.log(`[Tab] 绑定账号信息到tab ${tabId}:`, accountInfo);

  const tabObj = {
    id: tabId,
    btn,
    canvas,
    graph,
    graphCanvas,
    account: accountInfo  // 绑定账号信息到tab
  };
  tabs.push(tabObj);

  setupDrag(btn, tabObj);
  updateTabWidths();
  switchTab(tabId);
  setTimeout(() => {
    resizeCanvas(canvas);
  }, 0);
}

/**
 * Insert a tab button into the tab bar before the "+" button.
 * Uses live DOM lookup to avoid stale reference issues.
 */
function insertTabButton(btn, tabId) {
  const tabBar = getTabBar();
  if (!tabBar) {
    console.warn('[Tab] tabBar未找到，延迟插入');
    setTimeout(() => {
      const retryTabBar = document.getElementById("tab-bar");
      if (retryTabBar) {
        insertIntoBar(retryTabBar, btn);
      }
    }, 100);
    return;
  }

  const newTabBtn = document.getElementById("new-tab-btn");

  if (newTabBtn && tabBar.contains(newTabBtn)) {
    // +号按钮存在且在tabBar中，直接插入前面
    tabBar.insertBefore(btn, newTabBtn);
    console.log('[Tab] 插入到+号按钮前');
  } else {
    // +号按钮不存在或不在当前tabBar中，重建
    if (!newTabBtn) {
      const newBtn = document.createElement("button");
      newBtn.id = "new-tab-btn";
      newBtn.textContent = "+";
      newBtn.className = "new-tab-btn";
      newBtn.onclick = () => { showTabCreationDropdown(); };
      tabBar.appendChild(newBtn);
      console.log('[Tab] 重新创建+号按钮');
    }

    // 检查tabBar是否在DOM中
    if (!document.body.contains(tabBar)) {
      console.warn('[Tab] tabBar已脱离DOM，使用实时查找');
      const liveBar = document.getElementById("tab-bar");
      if (liveBar) {
        ensureNewBtnExists(liveBar);
        liveBar.insertBefore(btn, document.getElementById("new-tab-btn"));
        return;
      }
    }

    const retryNewTabBtn = document.getElementById("new-tab-btn");
    if (retryNewTabBtn && tabBar.contains(retryNewTabBtn)) {
      tabBar.insertBefore(btn, retryNewTabBtn);
      console.log('[Tab] 插入到重新创建的+号按钮前');
    } else if (retryNewTabBtn) {
      // retryNewTabBtn存在但不在tabBar中 → tabBar引用可能已失效
      console.warn('[Tab] +号按钮不在tabBar中，尝试实时查找tabBar');
      const liveBar = document.getElementById("tab-bar");
      if (liveBar && liveBar !== tabBar) {
        liveBar.insertBefore(btn, retryNewTabBtn);
        console.log('[Tab] 使用实时tabBar插入成功');
      } else {
        tabBar.appendChild(btn);
        console.log('[Tab] 添加到末尾');
      }
    } else {
      tabBar.appendChild(btn);
      console.log('[Tab] 添加到末尾');
    }
  }
}

function ensureNewBtnExists(bar) {
  if (!document.getElementById("new-tab-btn")) {
    const newBtn = document.createElement("button");
    newBtn.id = "new-tab-btn";
    newBtn.textContent = "+";
    newBtn.className = "new-tab-btn";
    newBtn.onclick = () => showTabCreationDropdown();
    bar.appendChild(newBtn);
  }
}

/** Insert into bar before + button (helper for delayed insertion). */
function insertIntoBar(bar, btn) {
  ensureNewBtnExists(bar);
  const newBtn = document.getElementById("new-tab-btn");
  if (newBtn && bar.contains(newBtn)) {
    bar.insertBefore(btn, newBtn);
  } else {
    bar.appendChild(btn);
  }
  console.log('[Tab] 延迟插入成功');
}

function closeTab(tabId) {
  const index = tabs.findIndex(tab => tab.id === tabId);
  if (index < 0) return;

  const tab = tabs[index];
  tab.graph?.clear?.();
  tab.canvas?.remove();
  tab.btn?.remove();
  tabs.splice(index, 1);

  const next = tabs[Math.max(0, index - 1)];
  if (next) {
    switchTab(next.id);
  } else {
    setCurrentTab(null);
  }

  updateTabWidths();
}

function resizeCanvas(canvas) {
  const parent = canvas.parentElement;
  const rect = parent.getBoundingClientRect();

  const dpr = window.devicePixelRatio || 1;

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";

  const ctx = canvas.getContext("2d");
  if (ctx) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // 同步 LiteGraph 的 bgcanvas
  const tab = tabs.find(t => t.canvas === canvas);
  if (tab?.graphCanvas) {
    const gc = tab.graphCanvas;
    if (gc.bgcanvas && gc.bgcanvas !== canvas) {
      gc.bgcanvas.width = canvas.width;
      gc.bgcanvas.height = canvas.height;
      gc.bgcanvas.style.width = canvas.style.width;
      gc.bgcanvas.style.height = canvas.style.height;
    }
    gc.setDirty(true, true);
  }
}

// 窗口缩放时自适应所有 canvas
window.addEventListener("resize", () => {
  tabs.forEach(tab => {
    if (tab.canvas) resizeCanvas(tab.canvas);
  });
});

// 显示tab创建下拉菜单
function showTabCreationDropdown() {

    // 检查是否已有下拉菜单
    let dropdown = document.getElementById("tab-creation-dropdown");
    if (dropdown) {
        dropdown.remove();
    }

console.log(`[Main] 事件WebSocket端口: ${REALTIME_WS_PORT}`);

// 简单的WebSocket连接管理
let wsConnection = null;
let isConnecting = false;
let _wsReconnectAttempts = 0;
const _WS_MAX_RECONNECT = 5;

// 直接连接WebSocket
function connectWebSocket() {
    if (_wsReconnectAttempts >= _WS_MAX_RECONNECT) {
        console.log('[Main] WebSocket重连次数已达上限，停止重连');
        return;
    }
    if (wsConnection && wsConnection.readyState === WebSocket.OPEN) {
        console.log('[Main] WebSocket已连接');
        return;
    }

    if (isConnecting) {
        console.log('[Main] WebSocket正在连接中...');
        return;
    }

    isConnecting = true;
    console.log('[Main] 开始连接WebSocket...');

    try {
        wsConnection = new WebSocket(eventWsUrl);

        wsConnection.onopen = () => {
            console.log('[Main] WebSocket连接成功');
            isConnecting = false;
            _wsReconnectAttempts = 0;  // 连接成功重置计数
            setupMessageHandler();
        };

        wsConnection.onerror = (error) => {
            console.error('[Main] WebSocket连接错误:', error);
            isConnecting = false;
        };

        wsConnection.onclose = (event) => {
            console.log('[Main] WebSocket连接关闭，代码:', event.code);
            wsConnection = null;
            isConnecting = false;

            // 非正常关闭时重连（最多 _WS_MAX_RECONNECT 次）
            if (event.code !== 1000) {
                _wsReconnectAttempts++;
                console.log(`[Main] WebSocket重连 (${_wsReconnectAttempts}/${_WS_MAX_RECONNECT})`);
                setTimeout(connectWebSocket, 3000);
            }
        };

    } catch (error) {
        console.error('[Main] WebSocket连接失败:', error);
        isConnecting = false;
        _wsReconnectAttempts++;
        if (_wsReconnectAttempts < _WS_MAX_RECONNECT) {
            setTimeout(connectWebSocket, 5000);
        }
    }
}

// 设置消息处理器
function setupMessageHandler() {
    if (!wsConnection) return;
    
    wsConnection.onmessage = (event) => {
        console.log('[Main] 收到WebSocket消息:', event.data);
        
        try {
            const data = JSON.parse(event.data);
            console.log('[Main] 解析后的WebSocket数据:', data);
            
            if (data.type === 'init_accounts') {
                // 后端下发的已注册账号列表（页面刷新后重建账号池）
                console.log('[Main] 收到账号列表:', data.accounts);
                if (!window.accountPool) window.accountPool = [];
                for (const acct of data.accounts) {
                    if (!window.accountPool.find(a => a.email === acct.email)) {
                        window.accountPool.push(acct);
                    }
                }
                console.log('[Main] 账号池已重建:', window.accountPool);

            } else if (data.type === 'log_output') {
                // 后端推来的日志
                window.taskflowLog?.(data.level || 'info', data.message);

            } else if (data.type === 'command') {
                console.log('[Main] 检测到command类型消息:', data.payload);

                if (data.payload.type === 'create_tab') {
                    // 创建新tab
                    taskQueue.addTask({
                        type: 'create_account_tab',
                        data: data.payload.account_info
                    });
                } else if (data.payload.type === 'focus_tab') {
                    // 聚焦已有tab
                    const existing = tabs.find(t =>
                        t.account && t.account.email === data.payload.account_info.email
                    );
                    if (existing) {
                        console.log('[Main] 聚焦到已有tab:', existing.id, existing.account?.name);
                        switchTab(existing.id);
                    } else {
                        console.log('[Main] 未找到对应tab，回退创建新tab:', data.payload.account_info);
                        taskQueue.addTask({
                            type: 'create_account_tab',
                            data: data.payload.account_info
                        });
                    }
                }
            }
        } catch (e) {
            console.warn('[Main] 解析WebSocket消息失败:', e);
        }
    };
    
    // 连接成功后等待WS命令创建账号tab
    setTimeout(() => {
        console.log('[Main] WebSocket就绪，等待后端创建账号tab...');
        taskQueue.setWebSocketReady(true);
    }, 2000);
}

// ===== 任务队列系统 =====
class TaskQueue {
    constructor() {
        this.tasks = [];
        this.isProcessing = false;
        this.websocketReady = false;
    }
    
    addTask(task) {
        console.log(`[TaskQueue] 添加任务: ${task.type}`, task.data);
        this.tasks.push(task);
        this.processQueue();
    }
    
    setWebSocketReady(ready) {
        console.log(`[TaskQueue] WebSocket状态: ${ready ? '就绪' : '未就绪'}`);
        this.websocketReady = ready;
        if (ready) {
            this.processQueue();
        }
    }
    
    async processQueue() {
        if (this.isProcessing || this.tasks.length === 0 || !this.websocketReady) {
            return;
        }
        
        this.isProcessing = true;
        console.log(`[TaskQueue] 开始处理任务队列，待处理任务数: ${this.tasks.length}`);
        
        while (this.tasks.length > 0 && this.websocketReady) {
            const task = this.tasks.shift();
            console.log(`[TaskQueue] 执行任务: ${task.type}`);
            
            try {
                await this.executeTask(task);
                console.log(`[TaskQueue] 任务完成: ${task.type}`);
            } catch (error) {
                console.error(`[TaskQueue] 任务执行失败: ${task.type}`, error);
            }
        }
        
        this.isProcessing = false;
        console.log(`[TaskQueue] 任务队列处理完成`);
    }
    
    async executeTask(task) {
        switch (task.type) {
            case 'create_account_tab':
                await this.executeCreateAccountTab(task.data);
                break;
            case 'node_operation':
                await this.executeNodeOperation(task.data);
                break;
            default:
                console.warn(`[TaskQueue] 未知任务类型: ${task.type}`);
        }
    }
    
    async executeCreateAccountTab(accountInfo) {
        console.log(`[TaskQueue] 创建账号tab任务: ${accountInfo.name} (${accountInfo.email})`);
        createAccountTab(accountInfo);
    }
    
    async executeNodeOperation(operationData) {
        console.log(`[TaskQueue] 执行节点操作:`, operationData);
        // 实现节点操作逻辑
        if (operationData.action && window[operationData.action]) {
            await window[operationData.action](operationData.params);
        }
    }
}

    if (window.accountManager) {
        window.accountManager.setCurrentAccount(accountInfo);

    // 将账号添加到账号池（供+号下拉菜单使用）

    }

    console.log(`[Main] ========== 账号tab创建完成: ${tabTitle} ==========`);
    return tab;
}

class DelayNode extends LiteGraph.LGraphNode {
  static title = "延迟";

  constructor() {
    super();
    this.category = "Flow";
    this.addInput("触发", LiteGraph.EVENT);
    this.addOutput("下一步", LiteGraph.EVENT);
    this.properties = { ms: 1000 };
    this.addWidget("number", "延迟(ms)", this.properties.ms, v => (this.properties.ms = v));

    // 禁用widget的键盘输入，强制使用属性编辑器
    if (this.widgets) {
      this.widgets.forEach(widget => {
        widget.onKeyDown = (e) => {
          e.stopPropagation();
          e.preventDefault();
          return false;
        };
      });
    }

    // 添加属性配置
    this.properties_info = [
      {
        name: "ms",
        type: "number",
        label: "延迟(ms)",
        min: 0,
        step: 1
      }
    ];
  }

  getHelpText() {
        return "延迟指定毫秒数后继续执行";
    }

  onDblClick() {
    openNodePropertyEditor(this);
    return true;
  }

  onConfigure(info) {
    // 同步widget值到properties
    if (this.widgets) {
      this.widgets.forEach(widget => {
        if (widget.name === "延迟(ms)") {
          widget.value = this.properties.ms;
        }
      });
    }
  }

  async onAction() {
    window.taskflowLog?.("info", `[延迟] ${this.properties.ms}ms`);
    reportNodeEvent(this, "trigger", { ms: this.properties.ms });
    const ms = Math.max(0, Number(this.properties.ms) || 0);
    await new Promise(resolve => setTimeout(resolve, ms));
    await this.execOutput(0);
  }
}

class GotoNode extends LiteGraph.LGraphNode {
  static title = "跳转";

  constructor() {
    super();
    this.title = "跳转";
    this.category = "Flow";

    this.addInput("触发", LiteGraph.EVENT);

    this.properties = {
      target: "label_1"
    };

    this._targetWidget = this.addWidget("text", "目标标签", this.properties.target, (value) => {
      this.properties.target = value;
    });

    // 禁用widget的键盘输入，强制使用属性编辑器
    this._targetWidget.onKeyDown = (e) => {
      e.stopPropagation();
      e.preventDefault();
      return false;
    };

    // 添加属性配置
    this.properties_info = [
      {
        name: "target",
        type: "text",
        label: "目标标签"
      }
    ];
  }


  onDblClick(e, pos, canvas) {
    openNodePropertyEditor(this);
    return true;
  }

  onConfigure(info) {
    // 同步widget值到properties
    if (this._targetWidget) this._targetWidget.value = this.properties.target;
  }

  async onAction(action, param, options) {
    const target = String(this.properties.target || "").trim();
    if (!target) {
      window.taskflowLog?.("warn", "[跳转] 目标标签为空");
      window.workflowController?.stop();
      return;
    }

    const graph = this.graph;
    if (!graph) return;

    const nodes = graph._nodes || [];
    const normalize = v => String(v ?? "").trim();
    const knownLabelTypes = new Set(["flow/label", "label"]);

    console.log(`[GotoNode] 查找label节点, target=${target}, 总节点数=${nodes.length}`);
    console.log(`[GotoNode] 所有节点:`, nodes.map(n => ({id: n.id, type: n.type, title: n.title})));

    for (const node of nodes) {
      const type = normalize(node.type).toLowerCase();
      const title = normalize(node.title);
      const isLabelLike = knownLabelTypes.has(type) || title === "Label" || title === "标签";
      console.log(`[GotoNode] 节点: type="${type}" title="${title}" isLabel=${isLabelLike} props=${JSON.stringify(node.properties)}`);
      if (!isLabelLike) continue;

      const candidates = [node.properties?.label, node.properties?.target, node.properties?.name,
                          node.properties?.id, node.properties?.tag, node.title, node.constructor?.title];
      if (node.widgets) {
        for (const w of node.widgets) candidates.push(w?.value);
      }
      const vals = candidates.map(normalize).filter(Boolean);
      console.log(`[GotoNode] 候选值: ${JSON.stringify(vals)} 目标="${target}"`);
      if (vals.includes(target)) {
        window.taskflowLog?.("info", `[跳转] 找到标签节点: ${target}`);

        // 图驱动：执行标签节点的 onAction，然后驱动其下游
        window.taskflowLog?.("info", `[跳转] 跳转到标签节点: ${target}`);
        await node.onAction?.("flow", param, options);
        // 驱动标签节点的下游
        if (typeof node.execOutput === "function") {
          await node.execOutput(0);
        }
        return;
      }
    }

    window.taskflowLog?.("error", `[跳转] 未找到目标标签: ${target}`);
    window.workflowController?.stop();
  }
}

LiteGraph.registerNodeType("flow/goto", GotoNode);
