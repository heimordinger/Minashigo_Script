class URLNode extends ActionNode {
    static title = "URL跳转";
    
    constructor() {
        super("URL跳转");
        this.category = "Action";
        
        this.addInput("触发", LiteGraph.EVENT);
        this.addInput("url", "string");
        this.addInput("wait_for_load", "boolean");
        this.addInput("timeout", "number");
        
        this.addOutput("下一步", LiteGraph.EVENT);
        this.addOutput("成功", "boolean");
        
        // 属性（默认值）
        this.properties = {
            url: "https://www.example.com",
            wait_for_load: true,
            timeout: 30
        };
        
        // 在节点上添加输入框
        this.addWidget("text", "URL", this.properties.url, (value) => {
            this.properties.url = value;
        });
        
        this.addWidget("toggle", "等待加载", this.properties.wait_for_load, (value) => {
            this.properties.wait_for_load = value;
        });
        
        this.addWidget("number", "超时(秒)", this.properties.timeout, (value) => {
            this.properties.timeout = value;
        }, { min: 1, max: 300 });
    }
    
    async onAction() {
        const url = this.getInputData(0) || this.properties.url;
        const waitForLoad = this.getInputData(1) ?? this.properties.wait_for_load;
        const timeout = this.getInputData(2) ?? this.properties.timeout;
        
        console.log(`[URLNode] 跳转到: ${url}`);
        
        if (!url) {
            console.error(`[URLNode] ❌ URL为空`);
            throw new Error("URL不能为空");
        }
        
        // 获取当前tab的账号信息
        const currentTabAccount = this.getCurrentTabAccount();
        const callParams = {
            url: url,
            wait_for_load: waitForLoad,
            timeout: timeout,
            account: currentTabAccount
        };
        
        try {
            const result = await this.callBackend("goto", callParams);
            
            if (result && result.success) {
                console.log(`[URLNode] ✅ 跳转成功: ${url}`);
                this.setOutputData(1, true);
                this.setOutputData(2, url);
                this.triggerSlot(0);
            } else {
                console.error(`[URLNode] ❌ 跳转失败: ${result?.error || '未知错误'}`);
                throw new Error(result?.error || "跳转失败");
            }
        } catch (error) {
            console.error(`[URLNode] ❌ 执行异常:`, error);
            console.error(`[URLNode] 异常详情:`, error.stack);
            throw error;
        }
    }
    
    onDblClick() {
        // 设置属性信息，供属性编辑器使用
        this.properties_info = [
            {
                name: "url",
                type: "string",
                label: "目标URL"
            },
            {
                name: "wait_for_load",
                type: "boolean",
                label: "等待加载完成"
            },
            {
                name: "timeout",
                type: "number",
                label: "超时时间(秒)",
                min: 1,
                max: 300
            }
        ];
        
        openNodePropertyEditor(this);
        return true;
    }
    
    onOpenPropertyEditor() {
        this.onDblClick();
    }
    
    getIcon() {
        return "🌐";
    }
    
    getCurrentTabAccount() {
        try {
            // 获取当前活跃的tab的账号信息
            const tabs = window.tabs || [];
            const currentTab = window.currentTab;
            
            console.log(`[URLNode] 获取当前tab账号信息:`);
            console.log(`[URLNode]   - 总tabs数: ${tabs.length}`);
            console.log(`[URLNode]   - 当前tab: ${currentTab?.id}`);
            
            if (currentTab && currentTab.account) {
                console.log(`[URLNode] ✅ 从当前tab获取账号: ${currentTab.account.email}`);
                return currentTab.account;
            }
            
            // 如果当前tab没有账号信息，尝试从其他tab获取
            for (const tab of tabs) {
                if (tab.account && tab.account.email) {
                    console.log(`[URLNode] ⚠️  从其他tab获取账号: ${tab.account.email}`);
                    return tab.account;
                }
            }
            
            // 最后回退到全局accountInfo
            if (window.accountInfo && window.accountInfo.email) {
                console.log(`[URLNode] ⚠️  从全局accountInfo获取账号: ${window.accountInfo.email}`);
                return window.accountInfo;
            }
            
            // 最后回退到默认账号
            console.log(`[URLNode] ❌ 使用默认账号`);
            return { name: 'default', email: 'default@example.com' };
            
        } catch (error) {
            console.error(`[URLNode] 获取当前tab账号失败:`, error);
            return { name: 'default', email: 'default@example.com' };
        }
    }

    getHelpText() {
        return `
URL跳转节点用于导航到指定网址。

参数说明：
- 目标URL: 要跳转的网址，支持http://和https://
- 等待加载完成: 是否等待页面完全加载
- 超时时间: 页面加载的最大等待时间

使用示例：
1. 设置目标URL为 https://www.google.com
2. 启用等待加载完成
3. 设置超时时间为30秒
4. 运行节点将跳转到Google首页
        `;
    }
}

class MatchImage extends ActionNode {
  static title = "匹配图片";
  constructor() {
    super("匹配图片");
    this.category = "Action";
    this.addInput("触发", LiteGraph.EVENT);

    this.addInput("图片路径", "string")
    this.addInput("阈值", "number")


    this.addOutput("下一步", LiteGraph.EVENT);

    this.addOutput("y","number");
    this.addOutput("max_val","number");


    /* ========= Properties ========= */
    this.properties = {
      img_path: "",
      threshold: 0.9,
      match_select: "best",
      use_color_check: false
    };

    this.previewImage = null;
    this._executed = false;

    /* ========= Widgets ========= */

    this.addWidget(
      "number",
      "阈值",
      this.properties.threshold,
      v => (this.properties.threshold = v),
      { min: 0, max: 1, step: 0.01 }
    );

    this.addWidget(
      "combo",
      "匹配策略",
      this.properties.match_select,
      v => (this.properties.match_select = v),
      {
        values: [
          "best",
          "left",
          "right",
          "top",
          "bottom",
          "top_left",
          "top_right",
          "bottom_left",
          "bottom_right"
        ]
      }
    );

    this.addWidget(
      "toggle",
      "颜色校验",
      this.properties.use_color_check,
      v => (this.properties.use_color_check = v)
    );

    this._imgPathWidget = this.addWidget(
      "text",
      "图片路径",
      this.properties.img_path,
      v => (this.properties.img_path = v)
    );

    this.addWidget("button", "选择图片", null, () => this._selectImage());

    // 禁用widget的键盘输入，强制使用属性编辑器
    if (this.widgets) {
      this.widgets.forEach(widget => {
        widget.onKeyDown = (e) => {
          e.stopPropagation();
          e.preventDefault();
          return false;
        };
      });
    }

    // 添加属性配置（不包含img_path，使用文件选择器）
    this.properties_info = [
      {
        name: "threshold",
        type: "number",
        label: "阈值",
        min: 0,
        max: 1,
        step: 0.01
      },
      {
        name: "match_select",
        type: "select",
        label: "匹配策略",
        options: [
          { value: "best", label: "最佳" },
          { value: "left", label: "左侧" },
          { value: "right", label: "右侧" },
          { value: "top", label: "顶部" },
          { value: "bottom", label: "底部" },
          { value: "top_left", label: "左上" },
          { value: "top_right", label: "右上" },
          { value: "bottom_left", label: "左下" },
          { value: "bottom_right", label: "右下" }
        ]
      },
      {
        name: "use_color_check",
        type: "boolean",
        label: "颜色校验"
      }
    ];

    // this.size = [360, 380];
  }

  onDblClick() {
    openNodePropertyEditor(this);
    return true;
  }

  /* ========= File Picker ========= */

  _selectImage() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";

    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;

      const path = file.path || file.name;

      // 转换为base64存储
      const reader = new FileReader();
      reader.onload = e => {
        this.properties.img_path = e.target.result; // 存储base64
        this._imgPathWidget.value = path; // widget显示路径
        this._loadPreviewFromBase64(e.target.result);
        this.setDirtyCanvas(true, true);
      };
      reader.readAsDataURL(file);
    };

    input.click();
  }

  /* ========= Load Preview from Base64 ========= */

  _loadPreviewFromBase64(base64) {
    const img = new Image();
    img.onload = () => {
      this.previewImage = img;
      this.setDirtyCanvas(true, true);
    };
    img.src = base64;
  }

  /* ========= Draw Preview ========= */

  onDrawForeground(ctx) {
  if (!this.previewImage) return;

  const img = this.previewImage;

  const padding = 10;

  const widgetHeight = this.widgets
    ? this.widgets.length * LiteGraph.NODE_WIDGET_HEIGHT
    : 0;

  const previewTop =
    LiteGraph.NODE_TITLE_HEIGHT + widgetHeight + 20;

  const maxW = this.size[0] - padding * 2;
  const maxH = this.size[1] - previewTop - padding;

  const scale = Math.min(maxW / img.width, maxH / img.height, 1);

  const w = img.width * scale;
  const h = img.height * scale;

  // ===== 真正的水平居中 =====
  const x = (this.size[0] - w) * 0.5;

  // ===== 垂直居中 =====
  const y = previewTop + (maxH - h) * 0.5;

  ctx.drawImage(img, x, y, w, h);

  ctx.strokeStyle = "#666";
  ctx.strokeRect(x, y, w, h);
}

  /* ========= Execution ========= */

  onAction(action) {
    this.run(action);
  }

  async onRun() {
    const {
      img_path,
      threshold,
      match_select,
      use_color_check
    } = this.properties;

    if (!img_path) {
      console.warn("MatchImageNode: img_path empty");
      return;
    }

    try {
      const response = await this.callBackend("match_image", {
        img_path,
        threshold,
        match_select,
        use_color_check
      });
      const result = response?.data || {};
      this.setOutputData(1, result.x ?? null);
      this.setOutputData(2, result.y ?? null);
      this.setOutputData(3, result.max_val ?? 0);
    } catch (e) {
      console.error("MatchImageNode failed:", e);
      throw e;
    }
  }
}

LiteGraph.registerNodeType("action/match_image", MatchImage);

        ]
      },
      {

      },
      {

        type: "number",
        label: "延迟(ms)",
        min: 0,
        step: 1000
      }
    ];
  }

  onDblClick(e, pos, canvas) {
    openNodePropertyEditor(this);
    return true;
  }

  onConfigure(info) {
    // 同步widget值到properties
    if (this.widgets) {
      this.widgets.forEach(widget => {
        if (widget.name === "异常类型") {
          widget.value = this.properties.exception_type;
        } else if (widget.name === "错误信息") {
          widget.value = this.properties.error_message;
        } else if (widget.name === "延迟(ms)") {
          widget.value = this.properties.delay_ms;
        }
      });
    }
  }

  // 获取异常类型的显示名称
  _getExceptionTypeLabel(exceptionType) {
    const labels = {
      "generic_error": "通用错误",
      "network_error": "网络错误",
      "timeout_error": "超时错误",
      "validation_error": "验证错误",
      "permission_error": "权限错误",
      "not_found_error": "未找到错误",
      "internal_error": "内部错误",
      "database_error": "数据库错误",
      "api_error": "API错误",
      "file_error": "文件错误",
      "memory_error": "内存错误",
      "concurrency_error": "并发错误"
    };
    return labels[exceptionType] || exceptionType;
  }

  async onAction(action, param, options) {
    console.log(`[TestErrorNode] ========== 节点开始执行 ==========`);
    console.log(`[TestErrorNode] 异常类型: ${this.properties.exception_type}`);
    console.log(`[TestErrorNode] 错误信息: ${this.properties.error_message}`);

    console.log(`[TestErrorNode] 抛出异常: ${this.properties.error_message}`);
    throw new errorClass(this.properties.error_message);
  }

  _getErrorClass(exceptionType) {
    switch (exceptionType) {

            super(message);

          }
        };
      case "timeout_error":

          }
        };
      case "validation_error":
        return class ValidationError extends Error {
          constructor(message) {

          }
        };
      case "permission_error":
        return class PermissionError extends Error {
          constructor(message) {

          }
        };
      case "not_found_error":
        return class NotFoundError extends Error {

        };
      case "internal_error":
        return class InternalError extends Error {

        };
      case "database_error":
        return class DatabaseError extends Error {

      case "api_error":

      case "file_error":
