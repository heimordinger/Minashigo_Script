                type: "select",
                label: "匹配策略",
                options: [
                    { value: "best", label: "最佳" },
                    { value: "left", label: "左侧" },
                    { value: "right", label: "右侧" },
                    { value: "top", label: "顶部" },
                    { value: "bottom", label: "底部" },
                    { value: "top_left", label: "左上" },
                    { value: "top_right", label: "右上" },
                    { value: "bottom_left", label: "左下" },
                    { value: "bottom_right", label: "右下" }
                ]
            },
            {
                name: "use_color_check",
                type: "boolean",
                label: "颜色校验"
            },
            {
                name: "timeout",
                type: "number",
                label: "超时(ms)",
                min: 0,
                step: 100
            }
        ];
    }

    getHelpText() {
        return "等待屏幕上出现指定图片<br>超时: 最大等待时间(秒)";
    }

    onDblClick() {
        openNodePropertyEditor(this);
        return true;
    }

    onConfigure(info) {
        // 同步widget值到properties
        if (this.widgets) {
            this.widgets.forEach(widget => {
                if (widget.name === "阈值") {
                    widget.value = this.properties.threshold;
                } else if (widget.name === "颜色校验") {
                    widget.value = this.properties.use_color_check;
                } else if (widget.name === "图片") {
                    if (this.properties.image && this.properties.image.startsWith("data:image")) {
                        widget.value = "(内嵌图片)";
                        this._loadPreviewFromBase64(this.properties.image);
                    } else {
                        widget.value = this.properties.image;
                    }
                } else if (widget.name === "超时(ms)") {
                    widget.value = this.properties.timeout;
                }
            });
        }
    }

    _selectImage() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";

        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;

            const path = file.path || file.name;

            // 转换为base64存储
            const reader = new FileReader();
            reader.onload = e => {
                this.properties.image = e.target.result; // 存储base64
                this._imgPathWidget.value = path; // widget显示路径
                this._loadPreviewFromBase64(e.target.result);
                this.setDirtyCanvas(true, true);
            };
            reader.readAsDataURL(file);
        };

        input.click();
    }

    _selectFromAssets() {
        pickFromAssets((dataUrl, fileName) => {
            this.properties.image = dataUrl;
            this._imgPathWidget.value = fileName;
            this._loadPreviewFromBase64(dataUrl);
            this.setDirtyCanvas(true, true);
        });
    }

    async onAction(action) {
        await this.run(action);
    }

    _loadPreviewFromBase64(base64) {
        const img = new Image();
        img.onload = () => {
            this.previewImage = img;
            this.setDirtyCanvas(true, true);
        };
        img.src = base64;
    }

    async onRun() {
        const image = this.getInputData(1) ?? this.properties.image;
        if (!image) throw new Error("image 为空");
        const name = image.startsWith("data:") ? "(内嵌图片)" : image.split("/").pop();
        this.log(`等待图片: ${name} (超时=${this.properties.timeout}ms)`);
        const response = await this.callBackend("wait_image", {
            image,
            threshold: this.properties.threshold,
            match_select: this.properties.match_select,
            use_color_check: this.properties.use_color_check,
            timeout: this.properties.timeout,
        }, this.properties.timeout);
        const timedOut = !response?.success;
        this.setOutputData(1, timedOut);
        this.log(timedOut ? "等待超时，图片未出现" : "图片已出现", timedOut ? "warn" : "info");
    }
}

    this.addInput("秒数", "number");
    this.addInput("上限", "number");
    this.addOutput("下一步", LiteGraph.EVENT);

    this.properties = { seconds: 1, upper_limit: null, step: 0.05 };
    this.addWidget("number", "秒数", this.properties.seconds, v => (this.properties.seconds = v));
    this.addWidget("number", "上限", this.properties.upper_limit, v => (this.properties.upper_limit = v));

    if (this.widgets) {
      this.widgets.forEach(widget => {
        widget.onKeyDown = (e) => {
          e.stopPropagation();
          e.preventDefault();
          return false;
        };
      });
    }

    // 添加属性配置
    this.properties_info = [
      {
        name: "seconds",
        type: "number",
        label: "秒数",
        min: 0,
        step: 0.05
      },
      {
        name: "upper_limit",
        type: "number",
        label: "上限",
        min: 0,
        step: 0.05
      },
      {
        name: "step",
        type: "number",
        label: "步长",
        min: 0.01,
        max: 1,
        step: 0.01
      }
    ];

    // 延迟事件队列
    this._pending = [];

    // 设置为ALWAYS模式，确保onExecute被调用
    this.mode = LiteGraph.ALWAYS;
  }

  getHelpText() {
        return "等待指定时间(秒)<br>支持小数，如 0.5 表示 500ms";
    }

  onDblClick() {
    openNodePropertyEditor(this);
    return true;
  }

  onConfigure(info) {
    // 同步widget值到properties
    if (this.widgets) {
      this.widgets.forEach(widget => {
        if (widget.name === "秒数") {
          widget.value = this.properties.seconds;
        } else if (widget.name === "上限") {
          widget.value = this.properties.upper_limit;
        }
      });
    }
  }

  async onAction(action, param, options) {
    const seconds = this.getInputData(1) ?? this.properties.seconds;
    const upper_limit = this.getInputData(2) ?? this.properties.upper_limit;

    window.taskflowLog?.("info", `[等待] 等待 ${seconds} 秒${upper_limit != null ? ` (上限 ${upper_limit}s)` : ""}`);

    if (seconds <= 0) {
      window.taskflowLog?.("info", "[等待] 等待时间为0，跳过");
      return;
    }

    // 使用async/await实现阻塞等待
    const delayMs = seconds * 1000;
    console.log(`[SleepNode] 开始等待 ${seconds} 秒 (${delayMs}ms)`);

    const controller = window.workflowController;
    const startTime = Date.now();

    const interval = 50;
    let elapsed = 0;

    while (elapsed < delayMs) {
      // 检查控制器状态，如果停止则中断
      if (controller && (controller.state === "stopped" || controller.state === "idle")) {
        window.taskflowLog?.("warn", "[等待] 控制器已停止，中断等待");
        return;
      }

      // 等待一小段时间
      await new Promise(resolve => setTimeout(resolve, Math.min(interval, delayMs - elapsed)));
      elapsed = Date.now() - startTime;
    }

    window.taskflowLog?.("info", `[等待] 等待完成 (${(elapsed/1000).toFixed(2)}s)`);
    await this.execOutput(0);
  }

  onExecute(param, options) {
    // 不需要onExecute
  }
}
LiteGraph.registerNodeType("flow/sleep", SleepNode);

            wait_for_load: true,
            timeout: 30
        };
        
        // 在节点上添加输入框
        this.addWidget("text", "URL", this.properties.url, (value) => {
            this.properties.url = value;
        });
        
        this.addWidget("toggle", "等待加载", this.properties.wait_for_load, (value) => {

        });
        
        this.addWidget("number", "超时(秒)", this.properties.timeout, (value) => {
            this.properties.timeout = value;
        }, { min: 1, max: 300 });
    }
    
    async onAction() {
        const url = this.getInputData(0) || this.properties.url;
        const waitForLoad = this.getInputData(1) ?? this.properties.wait_for_load;
        const timeout = this.getInputData(2) ?? this.properties.timeout;

        this.log(`跳转到: ${url}`);

        if (!url) {
            this.log(`URL为空`, "error");
            throw new Error("URL不能为空");
        }

        // 获取当前tab的账号信息
        const currentTabAccount = this.getCurrentTabAccount();
        const callParams = {
            url: url,
            wait_for_load: waitForLoad,
            timeout: timeout,
            account: currentTabAccount
        };

        try {
            const result = await this.callBackend("goto", callParams);

            if (result && result.success) {
                this.log(`跳转成功: ${url}`);
                this.setOutputData(1, true);
                this.setOutputData(2, url);
                await this.execOutput(0);
            } else {
                this.log(`跳转失败: ${result?.error || '未知错误'}`, "error");
                throw new Error(result?.error || "跳转失败");
            }
        } catch (error) {
            this.log(`执行异常: ${error.message}`, "error");
            throw error;
        }
    }
    
    onDblClick() {
        // 设置属性信息，供属性编辑器使用
        this.properties_info = [
            {
                name: "url",
                type: "string",
                label: "目标URL"
            },
            {
                name: "wait_for_load",
                type: "boolean",
                label: "等待加载完成"
            },
            {
                name: "timeout",
                type: "number",
                label: "超时时间(秒)",
                min: 1,
                max: 300
            }
        ];
        
        openNodePropertyEditor(this);
        return true;
    }
    
    onOpenPropertyEditor() {

          { value: "bottom_left", label: "左下" },
          { value: "bottom_right", label: "右下" }
        ]
      },
      {
        name: "use_human_offset",
        type: "boolean",
        label: "拟人偏移"
      }
    ];
  }

  getHelpText() {
        return "在屏幕上找到图片并点击<br>阈值: 匹配灵敏度(0-1)<br>偏移: 点击位置的偏移像素";
    }

  onDblClick() {
    openNodePropertyEditor(this);
    return true;
  }

  onConfigure(info) {
    if (this.widgets) {
      this.widgets.forEach(widget => {
        if (widget.name === "图片路径") {
          if (this.properties.image && this.properties.image.startsWith("data:image")) {
            widget.value = "(内嵌图片)";
            this._loadPreviewFromBase64(this.properties.image);
          } else {
            widget.value = this.properties.image;
          }
        } else if (widget.name === "阈值") {
          widget.value = this.properties.threshold;
        } else if (widget.name === "按下时长") {
          widget.value = this.properties.down_time;
        }
      });
    }
  }

  _selectImage() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";

    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;

      const path = file.path || file.name;

      // 转换为base64存储
      const reader = new FileReader();
      reader.onload = e => {
        this.properties.image = e.target.result; // 存储base64
        this._imgPathWidget.value = path; // widget显示路径
        this._loadPreviewFromBase64(e.target.result);
        this.setDirtyCanvas(true, true);
      };
      reader.readAsDataURL(file);
    };

    input.click();
  }

  _selectFromAssets() {
    pickFromAssets((dataUrl, fileName) => {
      this.properties.image = dataUrl;
      this._imgPathWidget.value = fileName;
      this._loadPreviewFromBase64(dataUrl);
      this.setDirtyCanvas(true, true);
    });
  }

  _loadPreviewFromBase64(base64) {
    const img = new Image();
    img.onload = () => {
      this.previewImage = img;
      this.setDirtyCanvas(true, true);
    };
    img.src = base64;
  }

  async onAction(action) {
    await this.run(action);
  }

  async onRun() {
    const image = this.getInputData(1) ?? this.properties.image;
    if (!image) throw new Error("image 为空");

    const name = image.startsWith("data:") ? "(内嵌图片)" : image.split("/").pop();
    this.log(`点击图片: ${name}`);

    const response = await this.callBackend("click_image", { ...this.properties, image });
    const data = response?.data || {};
    this.setOutputData(3, data.clicked_x ?? null);
    this.setOutputData(4, data.clicked_y ?? null);
    this.setOutputData(5, data.match_value ?? null);

    if (data.clicked_x != null) {
      this.log(`点击完成: (${data.clicked_x}, ${data.clicked_y})`);
      await this.execOutput(1); // 成功
    } else {
      this.log(`点击失败: 未找到图片`, "warn");
      await this.execOutput(2); // 失败
    }
  }
}

      {
        name: "match_select",
        type: "select",
        label: "匹配策略",
        options: [
          { value: "best", label: "最佳" },
          { value: "left", label: "左侧" },
          { value: "right", label: "右侧" },
          { value: "top", label: "顶部" },
          { value: "bottom", label: "底部" },
          { value: "top_left", label: "左上" },
          { value: "top_right", label: "右上" },
          { value: "bottom_left", label: "左下" },
          { value: "bottom_right", label: "右下" }
        ]
      },
      {
        name: "use_color_check",
        type: "boolean",
        label: "颜色校验"
      }
    ];

    // this.size = [360, 380];
  }

  getHelpText() {
        return "在屏幕上匹配图片位置<br>阈值: 匹配灵敏度(0-1)";
    }

  onDblClick() {
    openNodePropertyEditor(this);
    return true;
  }

  onConfigure(info) {
    // 从properties同步widget值
    if (this.widgets) {
      this.widgets.forEach(widget => {
        if (widget.name === "阈值") {
          widget.value = this.properties.threshold;
        } else if (widget.name === "匹配策略") {
          widget.value = this.properties.match_select;
        } else if (widget.name === "颜色校验") {
          widget.value = this.properties.use_color_check;
        } else if (widget.name === "图片路径") {
          // base64数据不显示原始字符串，显示占位文本
          if (this.properties.image && this.properties.image.startsWith("data:image")) {
            widget.value = "(内嵌图片)";
            this._loadPreviewFromBase64(this.properties.image);
          } else {
            widget.value = this.properties.image;
          }
        }
      });
    }
  }

  /* ========= File Picker ========= */

  _selectImage() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";

    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;

      const path = file.path || file.name;

      // 转换为base64存储
      const reader = new FileReader();
      reader.onload = e => {
        this.properties.image = e.target.result; // 存储base64
        this._imgPathWidget.value = path; // widget显示路径
        this._loadPreviewFromBase64(e.target.result);
        this.setDirtyCanvas(true, true);
      };
      reader.readAsDataURL(file);
    };

    input.click();
  }

  /* ========= Select from Assets ========= */

  _selectFromAssets() {
    pickFromAssets((dataUrl, fileName) => {
      this.properties.image = dataUrl;
      this._imgPathWidget.value = fileName;
      this._loadPreviewFromBase64(dataUrl);
      this.setDirtyCanvas(true, true);
    });
  }

  /* ========= Load Preview from Base64 ========= */

  _loadPreviewFromBase64(base64) {
    const img = new Image();
    img.onload = () => {
      this.previewImage = img;
      this.setDirtyCanvas(true, true);
    };
    img.src = base64;
  }

  /* ========= Execution ========= */

  async onAction(action) {
    await this.run(action);
  }

  async onRun() {
    const {
      image,
      threshold,
      match_select,
      use_color_check
    } = this.properties;

    if (!image) {
      console.warn("MatchImageNode: image empty");
      return;
    }

    const name = image.startsWith("data:") ? "(内嵌图片)" : image.split("/").pop();
    this.log(`匹配图片: ${name} (阈值=${threshold})`);

    try {
      const response = await this.callBackend("match_image", {
        image,
        threshold,
        match_select,
        use_color_check
      });
      const result = response?.data || {};
      this.setOutputData(3, result.x ?? null);
      this.setOutputData(4, result.y ?? null);
      this.setOutputData(5, result.max_val ?? 0);

      const matched = result.x != null;
      if (matched) {
        this.log(`匹配成功: (${result.x}, ${result.y}), 匹配度=${result.max_val?.toFixed(3)}`);
        await this.execOutput(1); // 成功
      } else {
        this.log(`匹配失败: 未找到 (匹配度=${result.max_val?.toFixed(3)})`, "warn");
        await this.execOutput(2); // 失败
      }
    } catch (e) {
      this.log(`匹配异常: ${e.message}`, "error");
      console.error("MatchImageNode failed:", e);
      throw e;
    }
  }
}

LiteGraph.registerNodeType("action/match_image", MatchImage);

class TestErrorNode extends LiteGraph.LGraphNode {
  static title = "测试错误";

  constructor() {
    super();

      exception_type: "generic_error", // 异常类型
      error_message: "测试错误",
      delay_ms: 5000
    };

    this.addWidget("text", "错误信息", this.properties.error_message, v => (this.properties.error_message = v));
    this.addWidget("number", "延迟(ms)", this.properties.delay_ms, v => (this.properties.delay_ms = v));

          { value: "validation_error", label: "验证错误" },
          { value: "permission_error", label: "权限错误" },
          { value: "not_found_error", label: "未找到错误" },
          { value: "internal_error", label: "内部错误" },
          { value: "database_error", label: "数据库错误" },
          { value: "api_error", label: "API错误" },
          { value: "file_error", label: "文件错误" },
          { value: "memory_error", label: "内存错误" },
          { value: "concurrency_error", label: "并发错误" }
        ]
      },
      {
        name: "error_message",
        type: "text",
        label: "错误信息"
      },
      {
        name: "delay_ms",
        type: "number",
        label: "延迟(ms)",
        min: 0,
        step: 1000
      }
    ];
  }

  onDblClick(e, pos, canvas) {
    openNodePropertyEditor(this);
    return true;
  }

  onConfigure(info) {
    // 同步widget值到properties
    if (this.widgets) {
      this.widgets.forEach(widget => {
        if (widget.name === "异常类型") {
          widget.value = this.properties.exception_type;
        } else if (widget.name === "错误信息") {
          widget.value = this.properties.error_message;
        } else if (widget.name === "延迟(ms)") {
          widget.value = this.properties.delay_ms;
        }
      });
    }
  }

  // 获取异常类型的显示名称
  _getExceptionTypeLabel(exceptionType) {
    const labels = {
      "generic_error": "通用错误",
      "network_error": "网络错误",
      "timeout_error": "超时错误",
      "validation_error": "验证错误",
      "permission_error": "权限错误",
      "not_found_error": "未找到错误",
      "internal_error": "内部错误",
      "database_error": "数据库错误",
      "api_error": "API错误",
      "file_error": "文件错误",
      "memory_error": "内存错误",
      "concurrency_error": "并发错误"
    };
    return labels[exceptionType] || exceptionType;
  }

  async onAction(action, param, options) {
    console.log(`[TestErrorNode] ========== 节点开始执行 ==========`);
    console.log(`[TestErrorNode] 异常类型: ${this.properties.exception_type}`);
    console.log(`[TestErrorNode] 错误信息: ${this.properties.error_message}`);
    console.log(`[TestErrorNode] 延迟: ${this.properties.delay_ms}ms`);

    const delay = this.properties.delay_ms || 5000;
    const errorClass = this._getErrorClass(this.properties.exception_type);

    console.log(`[TestErrorNode] 抛出异常: ${this.properties.error_message}`);
    throw new errorClass(this.properties.error_message);
  }

  _getErrorClass(exceptionType) {
    switch (exceptionType) {
      case "network_error":
        return class NetworkError extends Error {
          constructor(message) {
            super(message);
            this.name = "NetworkError";
          }
        };
      case "timeout_error":
        return class TimeoutError extends Error {
          constructor(message) {
            super(message);
            this.name = "TimeoutError";
          }
        };
      case "validation_error":
        return class ValidationError extends Error {
          constructor(message) {
            super(message);
            this.name = "ValidationError";
          }
        };
      case "permission_error":
        return class PermissionError extends Error {
          constructor(message) {
            super(message);
            this.name = "PermissionError";
          }
        };
      case "not_found_error":
        return class NotFoundError extends Error {
          constructor(message) {
            super(message);
            this.name = "NotFoundError";
          }
        };
      case "internal_error":
        return class InternalError extends Error {
          constructor(message) {
            super(message);
            this.name = "InternalError";
          }
        };
      case "database_error":
        return class DatabaseError extends Error {
          constructor(message) {
            super(message);
            this.name = "DatabaseError";
          }
        };
      case "api_error":
        return class APIError extends Error {
          constructor(message) {
            super(message);
            this.name = "APIError";
          }
        };
      case "file_error":
        return class FileError extends Error {
          constructor(message) {
            super(message);
            this.name = "FileError";
          }
        };
      case "memory_error":
        return class MemoryError extends Error {
          constructor(message) {
            super(message);

          }
        };
      case "concurrency_error":
        return class ConcurrencyError extends Error {
          constructor(message) {
            super(message);
            this.name = "ConcurrencyError";
          }
        };
      default:
        return "Error";
    }
  }
}
